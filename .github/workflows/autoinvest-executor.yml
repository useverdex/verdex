# Optional backup executor. The site's own server (server.mjs) runs the executor every ten minutes;
# this workflow does the same from GitHub if the repository variable AUTOINVEST_ADDRESS and the
# secret EXECUTOR_KEY are set. With them unset it never runs.
name: Auto-Invest executor
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: autoinvest-executor
  cancel-in-progress: false
jobs:
  run:
    if: ${{ vars.AUTOINVEST_ADDRESS != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/autoinvest-executor.mjs
            contracts/VerdexAutoInvest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund viem@2
      - run: node scripts/autoinvest-executor.mjs
        env:
          EXECUTOR_KEY: ${{ secrets.EXECUTOR_KEY }}
          AUTOINVEST_ADDRESS: ${{ vars.AUTOINVEST_ADDRESS }}
