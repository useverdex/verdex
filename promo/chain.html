<script type="module">
// Verdex on Base / Verdex on Solana: the lockup, where the stocks trade there, the same code, VERDEX stays home, the end card. ?chain=base|solana. renderAt(t) paints second t.
import { MARK_PATH } from '../src/components/logoPath.ts'
const MARK = (fill = '#C2EA8A') => `<svg viewBox="0 0 100 100" fill="${fill}" style="display:block"><path d="${MARK_PATH}"/></svg>`
const DURATION = 28
const PUB = '../public'
const L = (h) => `${PUB}/img/logos/${h}.webp`
const CH = (id) => `${PUB}/logos/chains/${id}.svg`
const CHAIN = new URLSearchParams(location.search).get('chain') === 'solana' ? 'solana' : 'base'
const C = CHAIN === 'base' ? {
  name: 'Base', logo: CH(8453), tag: 'Same contracts. More people.',
  h2: 'Where tokenized stocks trade today.', p2: "Coinbase's stocks live in their own pools on Base. The same site, the same contracts and the same executor, pointed at them.",

function spring(t, response = 0.5, damping = 1) {
  if (t <= 0) return 0
  const w = (2 * Math.PI) / response
  if (damping >= 1) return 1 - (1 + w * t) * Math.exp(-w * t)
  const wd = w * Math.sqrt(1 - damping * damping)
  return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + ((damping * w) / wd) * Math.sin(wd * t))
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
const mat = (el, p, { y = 0, x = 0, s = 0.04, blur = 14 } = {}) => {
  el.style.opacity = clamp(p)
  el.style.filter = p >= 0.999 ? 'none' : `blur(${((1 - clamp(p)) * blur).toFixed(2)}px)`
  el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - s * (1 - p)})`
}
const letters = (el, text) => { el.innerHTML = ''; return [...text].map((c) => add(el, `<span class="ch${c === ' ' ? ' sp' : ''}">${c === ' ' ? '' : c}</span>`)) }
function wipe(chars, p, { stagger = 0.045, blur = 12, dx = 18, out = 0 } = {}) {
  const n = chars.length
  chars.forEach((c, i) => {
    const q = clamp((p * (1 + stagger * n) - i * stagger)) * (1 - out)
    c.style.opacity = q
    c.style.filter = q >= 0.999 ? 'none' : `blur(${((1 - q) * blur).toFixed(2)}px)`
    c.style.transform = `translate3d(${((1 - q) * dx).toFixed(2)}px, 0, 0)`
  })
}
const show = (el, on) => { el.style.display = on ? '' : 'none' }

function build() {
  add(stage, `<div class="grid"></div>`)
  const glow = add(stage, `<div class="abs" style="left:50%;top:50%;width:1400px;height:900px;margin:-450px 0 0 -700px;background:radial-gradient(closest-side,rgba(194,234,138,.13),rgba(194,234,138,0));pointer-events:none"></div>`)

  // 1. The lockup. (0-5.6)
  const s1 = add(stage, `<div class="scene"></div>`)
  const lock = add(s1, `<div class="abs lock" style="left:0;right:0;top:250px"><span class="tl">${MARK()}</span><span class="x">×</span><span class="tl"><img src="${C.logo}" alt=""></span></div>`)
  const nameEl = add(s1, `<div class="abs" style="left:0;right:0;top:470px;text-align:center"><span class="serif" style="font-size:150px;line-height:1">Verdex on </span><span class="serif" style="font-size:150px;line-height:1;color:var(--lime)">${C.name}.</span></div>`)
  const tagEl = add(s1, `<div class="abs" style="left:0;right:0;top:700px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)"><div></div></div>`)
  const tagChars = letters(tagEl.firstElementChild, C.tag)

  // 2. The stocks there. (5.2-12.6)
  const s2 = add(stage, `<div class="scene"></div>`)
  const h2 = add(s2, `<div class="head" style="top:80px"><h1 class="serif">${C.h2}</h1><p>${C.p2}</p></div>`)
  const cards = C.cards.map(([sym, who, px, sub, img], i) => add(s2, `<div class="card" style="left:${270 + i * 480}px;top:330px"><div class="top"><img src="${img}" alt=""><div><b>${sym}</b><span>${who}</span></div></div><div class="px">${px}</div><div class="sub">${sub}</div></div>`))
  const cap2 = add(s2, `<div class="cap" style="top:720px">${C.cap2}</div>`)

  // 3. The same code. (12.2-19.6)
  const s3 = add(stage, `<div class="scene"></div>`)
  const h3 = add(s3, `<div class="head" style="top:80px"><h1 class="serif">${C.h3}</h1><p>${C.p3}</p></div>`)
  const rows = C.rows.map(([ic, b, t, out], i) => add(s3, `<div class="rt" style="top:${330 + i * 100}px">${ic}<b>${b}</b><span class="t">${t}</span><span class="out">${out}</span></div>`))

  // 4. VERDEX stays home. (19.2-24.6)
  const s4 = add(stage, `<div class="scene"></div>`)
  const h4 = add(s4, `<div class="head" style="top:80px"><h1 class="serif">VERDEX stays home.</h1><p>One pool, one supply, on Robinhood Chain. No second token, no wrapped copy. Every chain pays into the same place.</p></div>`)
  const flow = add(s4, `<div class="flow"></div>`)
  const N = [[`<img src="${C.logo}" alt="">`, `A fee on ${C.name}`, 'the same 0.25%, the same waiver for VERDEX holders', 'fee'], [MARK(), 'Bridged home', 'to the treasury on Robinhood Chain', 'bridged'], [`<img src="${CH(4663)}" alt="">`, 'Buys VERDEX', 'half burned, half paid back, like every other fee', 'VERDEX']]
  const nodes = [], arrows = []
  N.forEach(([ic, b, s, e], i) => { if (i) arrows.push(add(flow, `<div class="arr">→</div>`)); nodes.push(add(flow, `<div class="nd" style="width:360px">${ic}<b>${b}</b><span>${s}</span><em>${e}</em></div>`)) })
  const cap4 = add(s4, `<div class="cap" style="top:760px">We are not leaving Robinhood Chain. We are bringing it more people.</div>`)

  // 5. End card. (24.2-28)
  const s5 = add(stage, `<div class="scene"></div>`)
  const endLogo = add(s5, `<div class="abs lock" style="left:0;right:0;top:300px"><span style="width:160px;height:160px;display:inline-flex;margin-top:16px">${MARK()}</span><span class="serif" style="font-size:240px">Verdex</span><span class="x" style="margin:0 10px">×</span><span class="tl" style="width:170px;height:170px"><img src="${C.logo}" alt=""></span></div>`)
  const endTag = add(s5, `<div class="abs" style="left:0;right:0;top:610px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)">${C.end}</div>`)
  const endUrl = add(s5, `<div class="abs" style="left:0;right:0;top:710px;text-align:center"><span class="pill" style="font-size:30px;padding:14px 26px"><span style="width:14px;height:14px;border-radius:50%;background:var(--lime)"></span>useverdex.xyz</span></div>`)
  const endCa = add(s5, `<div class="abs" style="left:0;right:0;top:820px;text-align:center"><span class="pill" style="font-size:24px;padding:12px 22px;gap:14px"><span style="color:var(--lime);font-weight:600;letter-spacing:.08em;font-size:18px">CA</span><span style="font-family:var(--mono)">0x96f455a90a80dcf0c2df6703ea4ba3bedf286e43</span></span></div>`)

  const g = document.createElement('canvas'); g.width = 480; g.height = 270
  const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
  gx.putImageData(id, 0, 0)
  add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
  add(stage, `<div id="vignette"></div>`)
  const fade = add(stage, `<div id="fade"></div>`)

  window.renderAt = (t) => {
    glow.style.opacity = 0.5 + 0.5 * Math.sin(t * 0.8)

    show(s1, t < 5.6)
    const o1 = clamp(spring(t - 4.8, 0.45))
    const pl = spring(t - 0.2, 0.8)
    mat(lock, pl * (1 - o1), { y: 30 * (1 - pl), s: 0.08, blur: 22 })
    const pn = spring(t - 0.7, 0.7)
    mat(nameEl, pn * (1 - o1), { y: 40 * (1 - pn), s: 0.08, blur: 22 })
    wipe(tagChars, spring(t - 1.9, 0.9), { stagger: 0.035, out: clamp(spring(t - 4.7, 0.4)) })

    show(s2, t >= 5.2 && t < 12.6)
    const o2 = clamp(spring(t - 11.8, 0.5))
    const h2in = spring(t - 5.4, 0.9)
    mat(h2, h2in * (1 - o2), { y: 24 * (1 - h2in), s: 0.02 })
    cards.forEach((el, i) => { const p = spring(t - (5.9 + i * 0.35), 0.85); mat(el, p * (1 - o2), { y: 40 * (1 - p), s: 0.05, blur: 16 }) })
    const c2 = spring(t - 8.6, 0.9)
    mat(cap2, c2 * (1 - o2), { y: 16 * (1 - c2), s: 0.02 })

    show(s3, t >= 12.2 && t < 19.6)
    const o3 = clamp(spring(t - 18.8, 0.5))
    const h3in = spring(t - 12.4, 0.9)
    mat(h3, h3in * (1 - o3), { y: 24 * (1 - h3in), s: 0.02 })
    rows.forEach((el, i) => { const p = spring(t - (12.9 + i * 0.3), 0.85); mat(el, p * (1 - o3), { y: 30 * (1 - p), s: 0.03, blur: 12 }) })

    show(s4, t >= 19.2 && t < 24.6)
    const o4 = clamp(spring(t - 23.8, 0.5))
    const h4in = spring(t - 19.4, 0.9)
    mat(h4, h4in * (1 - o4), { y: 24 * (1 - h4in), s: 0.02 })
    nodes.forEach((el, i) => { const p = spring(t - (19.8 + i * 0.5), 0.85); mat(el, p * (1 - o4), { y: 30 * (1 - p), s: 0.05, blur: 16 }) })
    arrows.forEach((el, i) => { el.style.opacity = clamp(spring(t - (20.1 + i * 0.5), 0.6)) * (1 - o4) })
    const c4 = spring(t - 21.8, 0.9)
    mat(cap4, c4 * (1 - o4), { y: 16 * (1 - c4), s: 0.02 })

    show(s5, t >= 24.2)
    const e1p = spring(t - 24.4, 0.7), e2p = spring(t - 24.75, 0.7), e3p = spring(t - 25.0, 0.7), e4p = spring(t - 25.2, 0.7)
    mat(endLogo, e1p, { y: 30 * (1 - e1p), s: 0.06, blur: 20 })
    mat(endTag, e2p, { y: 20 * (1 - e2p), s: 0.02 })
    mat(endUrl, e3p, { y: 20 * (1 - e3p), s: 0.02 })
    mat(endCa, e4p, { y: 20 * (1 - e4p), s: 0.02 })

    fade.style.opacity = Math.max(1 - clamp(t / 0.4), clamp((t - (DURATION - 0.4)) / 0.4))
  }
}

build()
await document.fonts.ready
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r }))))
window.DURATION = DURATION
window.renderAt(0)
window.__ready = true
if (new URLSearchParams(location.search).has('play')) { const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }; loop() }
</script>
</body>
</html>
