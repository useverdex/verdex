<script type="module">
// Ten 12-second clips, one per tweet of the fourth batch. ?clip=manager|note|delegation|link|pr|changelog|leave|two|registry|free
import { MARK_PATH } from '../src/components/logoPath.ts'
const MARK = (fill = '#C2EA8A') => `<svg viewBox="0 0 100 100" fill="${fill}" style="display:block"><path d="${MARK_PATH}"/></svg>`
const PUB = '../public'
const L = (h) => `${PUB}/img/logos/${h}.webp`
const CH = (id) => `${PUB}/logos/chains/${id}.svg`

    const LINES = [`{ <span class="k">"id"</span>: <span class="s">"quality-growth"</span>,`, `  <span class="k">"manager"</span>: { <span class="k">"name"</span>: <span class="s">"Your name"</span> },`, `  <span class="k">"chainId"</span>: <span class="n">4663</span>, <span class="k">"rule"</span>: <span class="s">"month"</span>, <span class="k">"threshold"</span>: <span class="n">5</span>,`, `  <span class="k">"history"</span>: [{ <span class="k">"at"</span>: <span class="s">"2026-10-01"</span>, <span class="k">"note"</span>: <span class="s">"Published."</span>,`, `    <span class="k">"weights"</span>: [[<span class="s">"NVDA"</span>, <span class="n">30</span>], [<span class="s">"COST"</span>, <span class="n">20</span>], [<span class="s">"SLV"</span>, <span class="n">25</span>], [<span class="s">"SGOV"</span>, <span class="n">25</span>]] }] }`]
    const code = add(s, `<div class="code"><div class="fn"><span style="width:14px;height:14px;border-radius:50%;background:var(--lime);display:inline-block"></span>public/data/strategies.json</div><pre>${LINES.map((l) => `<span class="l">${l}</span>`).join('')}</pre></div>`)
    const ls = [...code.querySelectorAll('.l')]
    const pr = add(s, `<div class="pr"><span class="st">Open</span><div><b>Add strategy: Quality Growth</b><span>useverdex/verdex · +14 −0 · 1 file changed</span></div><span class="btn pri">Merge</span></div>`)
    const st = pr.querySelector('.st'), mb = pr.querySelector('.btn')
    const foot = add(s, `<div class="abs" style="left:0;right:0;top:820px;text-align:center;font-size:34px;font-weight:500;letter-spacing:-0.015em;will-change:opacity,transform,filter">The registry is open source. <span style="color:var(--lime)">So is the rest of Verdex.</span></div>`)
    return (t) => {
      runLine(l1, t, 0.3, 99, 0.025)
      const ci = spring(t - 1.0, 0.9); show(code, t > 0.8); mat(code, ci, { y: 30 * (1 - ci), s: 0.04, blur: 16 })
      ls.forEach((l, i) => { const p = spring(t - 1.6 - i * 0.5, 0.6); l.style.opacity = p; l.style.transform = `translate3d(${(1 - p) * 12}px, 0, 0)` })
      const pi = spring(t - 5.4, 0.9); show(pr, t > 5.2); mat(pr, pi, { y: 30 * (1 - pi), s: 0.04, blur: 16 })
      pressAt(mb, t, 7.4)
      const merged = t >= 7.6; st.classList.toggle('m', merged); st.textContent = merged ? 'Merged' : 'Open'; mb.textContent = merged ? 'Merged' : 'Merge'; mb.style.opacity = merged ? 0.5 : 1
      const fp = spring(t - 8.6, 0.9); show(foot, t > 8.4); mat(foot, fp, { y: 20 * (1 - fp), s: 0.02 })
    }
  },
  // 6. Every move has a reason.
  changelog(s) {
    const l1 = line(s, 'Every move has a reason.', { top: 120, size: 96 })
    const log = add(s, `<div class="log" style="top:280px;width:1100px;margin-left:-550px"><div class="t">AI Infrastructure · change log</div><div class="e new"><i></i><div><b>v2 · Sep 28</b><span>Trimmed NVDA to 22 and AMD to 8, added Nebius at 5 for neocloud exposure.</span></div></div><div class="e"><i></i><div><b>v1 · Sep 14</b><span>Published.</span></div></div></div>`)
    const nw = log.querySelector('.e.new')
    const D = [['NVDA', 25, 22], ['AMD', 10, 8], ['NBIS', 0, 5]]
    const rows = D.map(([tk, a, b], i) => add(s, `<div class="abs crow" style="left:50%;top:${560 + i * 74}px;width:1100px;margin-left:-550px;will-change:opacity,transform,filter"><img src="${LOGO[tk]}" style="width:34px;height:34px;border-radius:50%"><b style="font-size:20px;font-weight:500">${tk}</b><div class="bar" style="height:12px"><div class="tg" style="width:${(a * 3.2).toFixed(1)}%"></div><div class="ac" style="width:${(a * 3.2).toFixed(1)}%"></div></div><div style="font-size:19px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums"><span class="w">${a}%</span> <span style="color:var(--faint)">→</span> <span class="v" style="color:var(--lime);font-weight:500">${b}%</span></div></div>`))
    const foot = add(s, `<div class="abs" style="left:0;right:0;top:840px;text-align:center;font-size:34px;font-weight:500;letter-spacing:-0.015em;will-change:opacity,transform,filter">Followers read what changed, and why, <span style="color:var(--lime)">before they adopt it.</span></div>`)
    return (t) => {
      runLine(l1, t, 0.3, 99)
      const li = spring(t - 0.8, 0.9); show(log, t > 0.6); mat(log, li, { y: 30 * (1 - li), s: 0.04, blur: 16 })
      const np = spring(t - 2.4, 0.7, 0.7); nw.style.opacity = clamp(np * 1.5); nw.style.transform = `translate3d(0, ${((1 - clamp(np)) * -16).toFixed(2)}px, 0)`; nw.style.filter = np > 0.999 ? 'none' : `blur(${((1 - clamp(np)) * 10).toFixed(2)}px)`
      rows.forEach((r, i) => { const p = spring(t - 4.4 - i * 0.35, 0.8); show(r, t > 4.2); mat(r, p, { y: 20 * (1 - p), s: 0.02, blur: 12 }); const m = clamp(spring(t - 6.4 - i * 0.3, 0.8)); const [, a, b] = D[i]; r.querySelector('.ac').style.width = `${(lerp(a, b, m) * 3.2).toFixed(1)}%` })
      const fp = spring(t - 8.6, 0.9); show(foot, t > 8.4); mat(foot, fp, { y: 20 * (1 - fp), s: 0.02 })
    }
  },
  // 7. Stop following any time.
  leave(s) {
    const l1 = line(s, 'Stop following any time.', { top: 120, size: 96 })
    const v = vmini(s, { name: 'AI Infrastructure', sub: 'Robinhood Chain · 9 assets · every month or 5% drift', follow: 'Follows AI Infrastructure by Verdex Research · v2', ws: AI2.slice(0, 6), style: 'left:50%;top:280px;margin-left:-380px' })
    const btn = add(s, `<div class="abs" style="left:50%;top:700px;transform:translateX(-50%);will-change:opacity,transform,filter"><span class="btn sec" style="font-size:20px;height:56px;padding:0 26px">Stop following</span></div>`)
    const l2 = line(s, 'The vault stays yours.', { top: 790, size: 84, color: 'var(--lime)' })
    const foot = add(s, `<div class="abs" style="left:0;right:0;top:920px;text-align:center;font-size:30px;font-weight:500;letter-spacing:-0.015em;color:var(--soft);will-change:opacity,transform,filter">Same tokens, same wallet. From now on the weights are whatever you say they are.</div>`)
    return (t) => {
      runLine(l1, t, 0.3, 99)
      const vi = spring(t - 0.8, 0.9); show(v.el, t > 0.6); mat(v.el, vi, { y: 30 * (1 - vi), s: 0.04, blur: 16 })
      const bi = spring(t - 1.6, 0.9); show(btn, t > 1.4); btn.style.opacity = bi * (1 - clamp(spring(t - 5.2, 0.4))); btn.style.transform = `translate3d(-50%, ${(1 - bi) * 16}px, 0)`
      const inner = btn.firstElementChild; const press = t >= 4.6 && t < 4.8 ? 1 : clamp(1 - spring(t - 4.8, 0.3)); inner.style.transform = `scale(${(1 - 0.05 * (t >= 4.6 ? press : 0)).toFixed(3)})`
      const gone = t >= 4.8; v.em.style.opacity = gone ? clamp(1 - spring(t - 4.8, 0.4)) : 1
      if (gone && t >= 5.3) { v.em.textContent = 'Your own vault · weights are yours to edit'; v.em.style.opacity = clamp(spring(t - 5.3, 0.6)) }
      runLine(l2, t, 5.8, 99)
      const fp = spring(t - 8.0, 0.9); show(foot, t > 7.8); mat(foot, fp, { y: 16 * (1 - fp), s: 0.02 })
    }
  },
  // 8. Two managers. One wallet.
  two(s) {
    const l1 = line(s, 'Two managers. One wallet.', { top: 120, size: 96 })
    const a = vmini(s, { name: 'Compounders', sub: 'Robinhood Chain · 6 assets · every quarter or 5% drift', follow: 'Follows Compounders by Verdex Research · v1', ws: [['COST', 16.7], ['MSFT', 16.7], ['LLY', 16.7], ['ASML', 16.7], ['INTU', 16.7], ['CRWD', 16.7]], style: 'left:120px;top:290px;width:820px' })
    const b = vmini(s, { name: 'Quantum and Space', sub: 'Robinhood Chain · 6 assets · every month or 10% drift', follow: 'Follows Quantum and Space by Verdex Research · v2', ws: [['SPCX', 30], ['RKLB', 15], ['ASTS', 10], ['IONQ', 20], ['RGTI', 15], ['QBTS', 10]], style: 'left:980px;top:290px;width:820px' })
    const w = add(s, `<div class="abs" style="left:0;right:0;top:760px;text-align:center;will-change:opacity,transform,filter"><span class="pill" style="font-size:26px;padding:14px 24px"><span style="width:14px;height:14px;border-radius:50%;background:#7084FF;display:inline-block"></span>0x8f3C…A063 · Robinhood Chain · 2 vaults</span></div>`)
    const foot = add(s, `<div class="abs" style="left:0;right:0;top:870px;text-align:center;font-size:34px;font-weight:500;letter-spacing:-0.015em;will-change:opacity,transform,filter">Follow as many as you like. <span style="color:var(--lime)">Each one its own vault, all in the address you already hold.</span></div>`)
    return (t) => {
      runLine(l1, t, 0.3, 99)
      ;[a, b].forEach((v, i) => { const p = spring(t - 1.0 - i * 0.5, 0.9); show(v.el, t > 0.8 + i * 0.5); mat(v.el, p, { y: 40 * (1 - p), s: 0.05, blur: 18 }) })
      const wi = spring(t - 3.6, 0.9); show(w, t > 3.4); mat(w, wi, { y: 16 * (1 - wi), s: 0.02 })
      const fp = spring(t - 5.4, 0.9); show(foot, t > 5.2); mat(foot, fp, { y: 20 * (1 - fp), s: 0.02 })
    }
  },
  // 9. Six strategies at launch.
  registry(s) {
    const l1 = line(s, 'Six strategies at launch.', { top: 100, size: 96 })
    const cards = STRATS.map((st, i) => scard(s, st, `left:${150 + (i % 3) * 550}px;top:${270 + Math.floor(i / 3) * 330}px;width:520px;padding:22px 26px 24px`, { buttons: false }))
    const foot = add(s, `<div class="abs" style="left:0;right:0;top:940px;text-align:center;font-size:34px;font-weight:500;letter-spacing:-0.015em;will-change:opacity,transform,filter">Verdex Research publishes the house book. <span style="color:var(--lime)">Anyone can publish next.</span></div>`)
    return (t) => {
      runLine(l1, t, 0.3, 99)
      cards.forEach((el, i) => { const p = spring(t - 1.0 - i * 0.22, 0.85); show(el, t > 0.8); mat(el, p, { y: 40 * (1 - p), s: 0.05, blur: 16 }) })
      const fp = spring(t - 5.0, 0.9); show(foot, t > 4.8); mat(foot, fp, { y: 20 * (1 - fp), s: 0.02 })
    }
  },
  // 10. Holders follow for free.
  free(s) {
    const tile = add(s, `<div class="abs" style="left:50%;top:150px;width:140px;height:140px;margin-left:-70px;border-radius:34px;background:#000;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;box-shadow:0 30px 80px rgba(0,0,0,.7);will-change:transform,opacity,filter"><span style="width:80px;height:80px;display:inline-flex">${MARK()}</span></div>`)
    const h = add(s, `<div class="abs" style="left:0;right:0;top:330px;text-align:center;will-change:transform,opacity,filter"><div class="tag" style="display:inline-flex;align-items:center;padding:8px 16px;border-radius:8px;background:rgba(194,234,138,.14);color:var(--lime);font-size:22px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Hold VERDEX</div><div class="serif" style="font-size:92px;margin-top:18px">Holders follow for free.</div></div>`)
    const fee = add(s, `<div class="fee" style="top:560px"><span>Verdex fee per trade, following a strategy</span><span style="display:flex;align-items:center;gap:26px"><span class="old">0.25%<i></i></span><span class="new">0%</span></span></div>`)
    const strike = fee.querySelector('.old i'), nw = fee.querySelector('.new')
    const pills = [[I.check, 'No management fee'], [I.check, 'No performance fee'], [I.check, 'Checked onchain, every time']].map(([ic, tx], i) => add(s, `<div class="abs" style="left:${960 + (i - 1) * 440}px;top:720px;transform:translateX(-50%);will-change:opacity,transform,filter"><span class="pill" style="font-size:26px"><span style="width:22px;height:22px;display:inline-flex;color:var(--lime)">${ic}</span>${tx}</span></div>`))
    return (t) => {
      const tk = spring(t - 0.2, 0.7, 0.62); mat(tile, clamp(tk * 1.5), { y: -40 * (1 - tk), s: 0.3, blur: 18 })
      const hin = spring(t - 0.6, 0.9); mat(h, hin, { y: 24 * (1 - hin), s: 0.02 })
      const f5 = spring(t - 1.3, 0.8); mat(fee, f5, { y: 30 * (1 - f5), s: 0.04, blur: 16 })
      strike.style.width = `${(clamp(spring(t - 2.6, 0.4)) * 100).toFixed(1)}%`
      const nz = spring(t - 2.9, 0.5, 0.55); nw.style.opacity = clamp(nz * 2); nw.style.transform = `scale(${lerp(0.6, 1, nz).toFixed(3)})`
      pills.forEach((p, i) => { const q = spring(t - 4.2 - i * 0.3, 0.8); show(p, t > 4.0); p.style.opacity = q; p.style.transform = `translate3d(-50%, ${(1 - q) * 24}px, 0)`; p.style.filter = q > 0.999 ? 'none' : `blur(${((1 - q) * 12).toFixed(2)}px)` })
    }
  },
}
add(stage, `<div class="grid"></div>`)
const glow = add(stage, `<div class="abs" style="left:50%;top:50%;width:1400px;height:900px;margin:-450px 0 0 -700px;background:radial-gradient(closest-side,rgba(194,234,138,.12),rgba(194,234,138,0));pointer-events:none"></div>`)
const scene = add(stage, `<div class="scene"></div>`)
const draw = CLIPS[clip](scene)
const g = document.createElement('canvas'); g.width = 480; g.height = 270
const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
gx.putImageData(id, 0, 0)
add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
add(stage, `<div id="vignette"></div>`)
const fade = add(stage, `<div id="fade"></div>`)
window.renderAt = async (t) => {
  glow.style.opacity = 0.5 + 0.5 * Math.sin(t * 0.8)
  await draw(t)
  fade.style.opacity = Math.max(1 - clamp(t / 0.4), clamp((t - (DURATION - 0.4)) / 0.4))
}
await document.fonts.ready
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r }))))
window.DURATION = DURATION
await window.renderAt(0)
window.__ready = true
if (new URLSearchParams(location.search).has('play')) { const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }; loop() }
</script>
