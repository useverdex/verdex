<script type="module">
// Ten 12-second clips for the tenth tweet batch: the parts of Verdex never announced, from automated baskets to the app shell. ?clip=<name>
import { MARK_PATH } from '../src/components/logoPath.ts'
const MARK = (fill = '#C2EA8A') => `<svg viewBox="0 0 100 100" fill="${fill}" style="display:block"><path d="${MARK_PATH}"/></svg>`
const PUB = '../public'
const L = (h) => `${PUB}/img/logos/${h}.webp`
const CH = (id) => `${PUB}/logos/chains/${id}.svg`
const TOOL = (k) => `${PUB}/logos/tools/${k}.svg`
const LOGO = { NVDA: L('88a0e630'), SPY: L('c025dcd9'), TSLA: L('e8ca24f9'), GLD: L('8123a79a'), SLV: L('29352778'), USO: L('f34687ee'), PAXG: L('7869a6ce'), XAUT: L('941acb6b'), META: L('0b00cc62'), GOOGL: L('4d76db13'), SPCX: L('5a9801c3'), AMZN: L('39c11fed'), QQQ: L('8fbe91e2'), MSTR: L('48f06241'), IBIT: L('4c80de69'), TLT: L('0ee1c35f') }
const USDG = `${PUB}/img/tokens/usdg.png`, USDC = `${PUB}/img/tokens/usdc.png`
const clip = new URLSearchParams(location.search).get('clip') ?? 'browser'
const DURATION = 12

function spring(t, response = 0.5, damping = 1) {
  if (t <= 0) return 0
  const w = (2 * Math.PI) / response
  if (damping >= 1) return 1 - (1 + w * t) * Math.exp(-w * t)
  const wd = w * Math.sqrt(1 - damping * damping)
  return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + ((damping * w) / wd) * Math.sin(wd * t))
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, p) => a + (b - a) * p
const easeIO = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2)
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
const mat = (el, p, { y = 0, x = 0, s = 0.04, blur = 14 } = {}) => {
  el.style.opacity = clamp(p)
  el.style.filter = p >= 0.999 ? 'none' : `blur(${((1 - clamp(p)) * blur).toFixed(2)}px)`
  el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - s * (1 - p)})`
}
const letters = (el, text) => { el.innerHTML = ''; return [...text].map((c) => add(el, `<span class="ch${c === ' ' ? ' sp' : ''}">${c === ' ' ? '' : c}</span>`)) }
function wipe(chars, p, { stagger = 0.045, blur = 12, dx = 18, out = 0 } = {}) {
  const n = chars.length
  chars.forEach((c, i) => {
    const q = clamp((p * (1 + stagger * n) - i * stagger)) * (1 - out)
    c.style.opacity = q
    c.style.filter = q >= 0.999 ? 'none' : `blur(${((1 - q) * blur).toFixed(2)}px)`
    c.style.transform = `translate3d(${((1 - q) * dx).toFixed(2)}px, 0, 0)`
  })
}
const show = (el, on) => { el.style.display = on ? '' : 'none' }
const usd = (v, d = 0) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })
const line = (parent, text, { top = 460, size = 112, color = '#fff' } = {}) => {
  const el = add(parent, `<div class="line" style="top:${top}px"><div class="serif t" style="font-size:${size}px;color:${color}"></div></div>`)
  return { el, chars: letters(el.querySelector('.t'), text) }
}
const runLine = (ln, t, t0, t1, stagger = 0.035) => { show(ln.el, t >= t0 - 0.05 && t < t1 + 0.6); wipe(ln.chars, spring(t - t0, 0.8), { stagger, out: clamp(spring(t - t1, 0.35)) }) }
const rise = (el, t, t0, { y = 14, r = 0.6 } = {}) => { const p = spring(t - t0, r); show(el, t >= t0 - 0.05); el.style.opacity = clamp(p * 1.4); el.style.transform = `translate3d(0, ${((1 - p) * y).toFixed(2)}px, 0)` }
const capIn = (el, t, t0) => { const q = spring(t - t0, 0.9); show(el, t > t0 - 0.1); mat(el, q, { y: 16 * (1 - q), s: 0.02 }) }
const pick = (list, idx, t0, t) => list.forEach((c, i) => { const p = spring(t - t0, 0.35, 0.6); const on = i === idx && t >= t0; c.classList.toggle('on', on); c.style.transform = on ? `scale(${(1 + 0.08 * (1 - p)).toFixed(3)})` : 'none' })
const typed = (el, text, t, t0, cps = 26, cursor = true) => { const n = clamp(Math.floor((t - t0) * cps), 0, text.length); const done = n >= text.length; el.innerHTML = text.slice(0, n) + (cursor && !done && t >= t0 ? '<span class="cur"></span>' : ''); return done }
const I = {
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
}

const RH = CH(4663), SOLC = CH(1151111081099710), BASE = CH(8453), BNB = CH(56), ETHC = CH(1)
const ISS = (n) => `${PUB}/logos/issuers/${n}`
const TOTAL = 10
const ep = (s, n) => { const el = add(s, `<div class="ep"><i></i><b>How Verdex works</b><span>${n} of ${TOTAL}</span></div>`); return (t) => { const p = spring(t - 0.15, 0.8); el.style.opacity = clamp(p); el.style.transform = `translate3d(0, ${(10 * (1 - p)).toFixed(2)}px, 0)` } }
const facts = (s, R, top = 300, step = 98) => R.map(([ic, n, d, out], i) => add(s, `<div class="rt" style="top:${top + i * step}px">${ic}<b>${n}</b><span class="t">${d}</span>${out ? `<span class="out" style="font-size:22px;color:var(--lime)">${out}</span>` : ''}</div>`))
const runFacts = (rows, t, t0 = 4.5, st = 0.26) => rows.forEach((el, i) => { const p = spring(t - t0 - i * st, 0.85); show(el, t > t0 - 0.1 + i * st); mat(el, p, { y: 30 * (1 - p), s: 0.03, blur: 12 }) })
const IMG = (src) => `<img src="${src}" alt="">`
const TL = (txt) => `<span class="tile">${txt}</span>`

const CLIPS = {
  // 1. No backend.
  browser(s) {
    const e = ep(s, 1)
    const l1 = line(s, 'No server. No database.', { top: 470, size: 100 })

    const rows = facts(s, [[IMG(RH), 'Robinhood Chain RPC', 'prices, pools, positions and fees, read straight from the chain', 'live'], [TL('LI'), 'LI.FI API', 'one quote for every swap and bridge, across 50+ chains', 'live'], [IMG(SOLC), 'Jupiter and a Solana RPC', 'Private Markets, read from the pools and the mint', 'every minute'], [TL('0'), 'Nothing stored', 'no account, no cookies, no list of wallets anywhere', 'ever']])
    const cap = add(s, `<div class="cap" style="top:790px">Open source. The code that runs in your browser is the code on GitHub, commit by commit.</div>`)
    return (t) => { e(t); runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2); runFacts(rows, t); capIn(cap, t, 9.2) }
  },
  // 2. LI.FI.
  lifi(s) {

    const outs = rows.map((r) => r.querySelector('.out'))
    const cap = add(s, `<div class="cap" style="top:800px">Every one is asked. The best route wins. The Verdex fee rides on it: 0.25%, or 0% when the wallet holds VERDEX.</div>`)
    return (t) => { e(t); runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2); runFacts(rows, t, 4.5, 0.22); rows.forEach((r, i) => { const win = t >= 7.6 && i === 1; r.classList.toggle('on', win); outs[i].textContent = win ? 'best route' : 'asked'; outs[i].style.color = win ? 'var(--lime)' : 'var(--muted)' }); capIn(cap, t, 9.2) }
  },
  // 3. Robinhood Chain.
  robinhood(s) {
    const e = ep(s, 3)
    const l1 = line(s, 'Robinhood Chain.', { top: 470 })
    const l2 = line(s, 'Where the stocks live.', { top: 470, color: 'var(--lime)' })
    const rows = facts(s, [[IMG(RH), 'Chain 4663', 'a tenth of a second per block', '0.1 s'], [IMG(LOGO.NVDA), 'Tokenized stocks', 'NVDA, TSLA, SPY, AAPL, GOOGL, META, MSFT, AMZN and more', ''], [IMG(USDG), 'USDG', 'the dollar on the chain', ''], [TL('RH'), 'robin.etherscan.io', 'every transaction Verdex makes, linked', '']])
    const cap = add(s, `<div class="cap" style="top:790px">VERDEX, Verdex Pools, Asset Yield, Orders and the Launchpad all run here.</div>`)
    return (t) => { e(t); runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2); runFacts(rows, t); capIn(cap, t, 9.2) }
  },
  // 4. Uniswap v3 and v4.
  uniswap(s) {
    const e = ep(s, 4)
    const l1 = line(s, 'Uniswap v3 and v4.', { top: 470 })
    const l2 = line(s, 'The pools under everything.', { top: 470, size: 96, color: 'var(--lime)' })
    const rows = facts(s, [[TL('v3'), 'The stock pools', 'Verdex Pools and Asset Yield mint positions through the public position manager', ''], [TL('v4'), 'The VERDEX pool', 'behind the Pons hook that charges the creator fee on every trade', ''], [TL('%'), 'Fee APR', 'one day of the pool fee at today’s volume, times 365, over the liquidity', '']], 310, 104)
    const cap = add(s, `<div class="cap" style="top:790px">The same pools the Uniswap app shows. Open there, close here, or the other way round.</div>`)
    return (t) => { e(t); runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2); runFacts(rows, t); capIn(cap, t, 9.2) }
  },
  // 5. Pons V2.
  pons(s) {
    const e = ep(s, 5)
    const l1 = line(s, 'Pons V2.', { top: 470 })

    const rows = facts(s, [[TL('P'), 'Launch fee', 'paid to the factory, once', '0.0005 ETH'], [TL('P'), 'Curve fee', 'on every trade on the bonding curve', '1%'], [TL('P'), 'Graduation', 'the curve moves into a Uniswap v4 pool, liquidity locked', '4.2 ETH'], [TL('P'), 'Creator tax', 'paid in full to the creator wallet on every sweep', '2%']])
    const cap = add(s, `<div class="cap" style="top:790px">Verified contracts on Robinhood Chain, read live. The Launchpad is a front door to the same factory.</div>`)
    return (t) => { e(t); runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2); runFacts(rows, t); capIn(cap, t, 9.2) }
  },
  // 6. Spark Savings.
  spark(s) {
    const e = ep(s, 6)
    const l1 = line(s, 'Spark Savings USDG.', { top: 470, size: 100 })
    const l2 = line(s, 'Cash that earns by the second.', { top: 470, size: 92, color: 'var(--lime)' })
    const rows = facts(s, [[TL('4626'), 'ERC-4626 vault', 'you hold spUSDG, worth more USDG every second', ''], [IMG(USDG), 'Rate', 'read from the vault, compounded per second', '3.50% APY'], [TL('cap'), 'Deposit cap', 'set by Spark, checked before you sign', '500M USDG'], [TL('out'), 'Exit', 'withdraw any share, any time, no lock, no fee', 'any time']])
    const cap = add(s, `<div class="cap" style="top:790px">The rate is Spark’s and moves when Spark moves it. Verdex reads it, nothing more.</div>`)
    return (t) => { e(t); runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2); runFacts(rows, t); capIn(cap, t, 9.2) }
  },
  // 7. Reserve.
  reserve(s) {
    const e = ep(s, 7)
    const l1 = line(s, 'Reserve.', { top: 470 })
    const l2 = line(s, 'Baskets backed one to one.', { top: 470, size: 96, color: 'var(--lime)' })
    const rows = facts(s, [[IMG(ISS('reserve.png')), 'Index baskets', 'a token backed by the assets it names; mint and redeem are open calls', ''], [IMG(ISS('reserve.png')), 'Automated baskets', 'rebalanced to their target weights on a schedule', ''], [IMG(BASE) + IMG(BNB) + IMG(ETHC), 'Chains', 'Base, BNB Chain and Ethereum, read from the Reserve contracts', '']], 310, 104)
    const cap = add(s, `<div class="cap" style="top:790px">Every basket page carries the issuer’s own description and risk list. Bought from your own wallet.</div>`)
    return (t) => { e(t); runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2); runFacts(rows, t); capIn(cap, t, 9.2) }
  },
  // 8. Kamino.
  kamino(s) {
    const e = ep(s, 8)
    const l1 = line(s, 'Kamino.', { top: 470 })
    const l2 = line(s, 'Lend and borrow on Solana.', { top: 470, size: 96, color: 'var(--lime)' })
    const rows = facts(s, [[IMG(`${PUB}/img/kamino.svg`), 'Markets', 'xStocks Market, STRCx Market, Sentora xStocks Market', ''], [IMG(SOLC), 'Supply, Borrow, Multiply', 'one transaction each, from your own Solana wallet', ''], [TL('%'), 'Rates', 'move with how much of each token is borrowed', 'live']], 310, 104)
    const cap = add(s, `<div class="cap" style="top:790px">Verdex reads the markets and the rates. The position is yours, on Kamino.</div>`)
    return (t) => { e(t); runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2); runFacts(rows, t); capIn(cap, t, 9.2) }

  // 9. Jupiter and Token-2022.
  jupiter(s) {
    const e = ep(s, 9)
    const l1 = line(s, 'Jupiter and Token-2022.', { top: 470, size: 100 })
    const l2 = line(s, 'Private Markets, read from the mint.', { top: 470, size: 90, color: 'var(--lime)' })
    const rows = facts(s, [[IMG(TOOL('jupiter')), 'Jupiter', 'price, liquidity, volume and holders for every current mint', ''], [IMG(SOLC), 'Solana RPC', 'transfer fee, pause switch and supply, from the mint itself', ''], [TL('22'), 'Token-2022', 'the mint standard with the fee and the switches built in', '']], 310, 104)
    const cap = add(s, `<div class="cap" style="top:790px">Seven companies, one request a minute, no key and no server. The trade happens on Jupiter.</div>`)
    return (t) => { e(t); runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2); runFacts(rows, t); capIn(cap, t, 9.2) }
  },
  // 10. Simulated before you sign.
  simulate(s) {
    const e = ep(s, 10)
    const l1 = line(s, 'Simulated before you sign.', { top: 470, size: 96 })
    const l2 = line(s, 'The trade runs before your wallet opens.', { top: 470, size: 84, color: 'var(--lime)' })
    const rows = facts(s, [[TL('call'), 'eth_call with state overrides', 'the exact transaction, run against the chain, before you see the button', ''], [TL('x130'), 'Multicall3', '130 pools in one request', ''], [TL('6963'), 'EIP-6963', 'any wallet announces itself; no SDK, no list', ''], [TL('✓'), 'Nothing hidden', 'amounts, minimums and deadlines are the ones your wallet shows', '']])
    const cap = add(s, `<div class="cap" style="top:790px">If the simulation fails, the button never turns on.</div>`)
    return (t) => { e(t); runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2); runFacts(rows, t); capIn(cap, t, 9.2) }
  },
}

add(stage, `<div class="grid"></div>`)
const glow = add(stage, `<div class="abs" style="left:50%;top:50%;width:1400px;height:900px;margin:-450px 0 0 -700px;background:radial-gradient(closest-side,rgba(194,234,138,.12),rgba(194,234,138,0));pointer-events:none"></div>`)
const scene = add(stage, `<div class="scene"></div>`)
const draw = CLIPS[clip](scene)
const g = document.createElement('canvas'); g.width = 480; g.height = 270
const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
gx.putImageData(id, 0, 0)
add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
add(stage, `<div id="vignette"></div>`)
const fade = add(stage, `<div id="fade"></div>`)
window.renderAt = async (t) => {
  glow.style.opacity = 0.5 + 0.5 * Math.sin(t * 0.8)
  await draw(t)
  fade.style.opacity = Math.max(1 - clamp(t / 0.4), clamp((t - (DURATION - 0.4)) / 0.4))
}
await document.fonts.ready
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r }))))
window.DURATION = DURATION
await window.renderAt(0)
window.__ready = true
if (new URLSearchParams(location.search).has('play')) { const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }; loop() }
</script>
