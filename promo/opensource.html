// Open source reveal: the name, a clone into the file tree, a real code excerpt, what is inside, the repo card, the end card. renderAt(t) paints second t.
import { MARK_PATH } from '../src/components/logoPath.ts'
const MARK = (fill = '#C2EA8A') => `<svg viewBox="0 0 100 100" fill="${fill}" style="display:block"><path d="${MARK_PATH}"/></svg>`
const DURATION = 32

function spring(t, response = 0.5, damping = 1) {
  if (t <= 0) return 0
  const w = (2 * Math.PI) / response
  if (damping >= 1) return 1 - (1 + w * t) * Math.exp(-w * t)
  const wd = w * Math.sqrt(1 - damping * damping)
  return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + ((damping * w) / wd) * Math.sin(wd * t))
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, p) => a + (b - a) * p
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
const mat = (el, p, { y = 0, x = 0, s = 0.04, blur = 14 } = {}) => {
  el.style.opacity = clamp(p)
  el.style.filter = p >= 0.999 ? 'none' : `blur(${((1 - clamp(p)) * blur).toFixed(2)}px)`
  el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - s * (1 - p)})`
}
const letters = (el, text) => { el.innerHTML = ''; return [...text].map((c) => add(el, `<span class="ch${c === ' ' ? ' sp' : ''}">${c === ' ' ? '' : c}</span>`)) }
function wipe(chars, p, { stagger = 0.045, blur = 12, dx = 18, out = 0 } = {}) {
  const n = chars.length
  chars.forEach((c, i) => {
    const q = clamp((p * (1 + stagger * n) - i * stagger)) * (1 - out)
    c.style.opacity = q
    c.style.filter = q >= 0.999 ? 'none' : `blur(${((1 - q) * blur).toFixed(2)}px)`
    c.style.transform = `translate3d(${((1 - q) * dx).toFixed(2)}px, 0, 0)`
  })
}
const show = (el, on) => { el.style.display = on ? '' : 'none' }

  const FILES = [['d', '.github', 'CI: lint, typecheck, build'], ['d', 'promo', 'Launch films, clips, tweet copy'], ['d', 'public', 'Data snapshots, logos, app icons'], ['d', 'scripts', 'Logo packing, app icons, release'], ['d', 'src', 'Pages, engines, theme'], ['f', 'CONTRIBUTING.md', 'Setup and the non-custodial rules'], ['f', 'LICENSE', 'MIT'], ['f', 'README.md', 'What it does and how to run it'], ['f', 'SECURITY.md', 'How to report, what the site never does']]
  const repo = add(s2, `<div class="repo"><div class="top"><span class="mk"><span style="width:20px;height:20px;display:inline-flex">${MARK()}</span></span><span style="font-weight:500">useverdex / verdex</span><span style="color:var(--muted)">Verdex: initial public release</span><span class="br">main</span></div>${FILES.map(([k, n, m]) => `<div class="row"><span class="ic ${k}">${k === 'd' ? I.folder : I.file}</span><span class="n">${n}</span><span class="m">${m}</span><span class="t">now</span></div>`).join('')}</div>`)

  const sub5 = add(s5, `<div class="abs" style="left:0;right:0;top:770px;text-align:center;font-size:30px;font-weight:500;letter-spacing:-0.015em;color:var(--soft);will-change:opacity,transform,filter">Issues and pull requests are open. Every rule that keeps it non-custodial is in CONTRIBUTING.md.</div>`)

  const endLogo = add(s8, `<div class="abs" style="left:0;right:0;top:330px;display:flex;justify-content:center;align-items:center;gap:36px"><span style="width:160px;height:160px;display:inline-flex;margin-top:16px">${MARK()}</span><span class="serif" style="font-size:240px">Verdex</span></div>`)
  const endTag = add(s8, `<div class="abs" style="left:0;right:0;top:640px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)">Open source. Now.</div>`)
  const endUrl = add(s8, `<div class="abs" style="left:0;right:0;top:740px;text-align:center"><span class="pill" style="font-size:30px;padding:14px 26px"><span style="width:14px;height:14px;border-radius:50%;background:var(--lime)"></span>github.com/useverdex/verdex</span></div>`)
  const endCa = add(s8, `<div class="abs" style="left:0;right:0;top:850px;text-align:center"><span class="pill" style="font-size:24px;padding:12px 22px;gap:14px"><span style="color:var(--lime);font-weight:600;letter-spacing:.08em;font-size:18px">CA</span><span style="font-family:var(--mono)">0x96f455a90a80dcf0c2df6703ea4ba3bedf286e43</span></span></div>`)

  const g = document.createElement('canvas'); g.width = 480; g.height = 270
  const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
  gx.putImageData(id, 0, 0)
  add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
  add(stage, `<div id="vignette"></div>`)
  const fade = add(stage, `<div id="fade"></div>`)

  window.renderAt = (t) => {
    glow.style.opacity = 0.5 + 0.5 * Math.sin(t * 0.8)

    // 1. Verdex is (0.3-1.7), Open source (1.9-5.4)
    show(s1, t < 6)
    wipe(comingChars, spring(t - 0.3, 0.9), { out: clamp(spring(t - 1.6, 0.35)) })
    const pn = spring(t - 1.9, 0.7)
    mat(nameEl, pn * (1 - clamp(spring(t - 5.2, 0.45))), { y: 40 * (1 - pn), s: 0.08, blur: 22 })
    wipe(tagChars, spring(t - 2.7, 0.9), { stagger: 0.03, out: clamp(spring(t - 5.1, 0.4)) })

    // 2. Clone (5.6-12.4)
    show(s2, t >= 5.4 && t < 13)
    const o2 = clamp(spring(t - 12.2, 0.5))
    const h2in = spring(t - 5.6, 0.9)
    mat(h2, h2in * (1 - o2), { y: 24 * (1 - h2in), s: 0.02 })
    const tin = spring(t - 5.9, 0.85)
    mat(term, tin * (1 - o2), { y: 40 * (1 - tin) + 20 * o2, s: 0.05, blur: 18 })
    const n = clamp(Math.floor((t - 6.3) / 0.045), 0, CMD.length)
    cmdEl.textContent = CMD.slice(0, n)
    curEl.style.opacity = t < 7.9 ? (Math.floor(t * 2.5) % 2 ? 1 : 0.15) : 0
    out1.style.opacity = clamp(spring(t - 8.0, 0.4))
    out2.style.opacity = clamp(spring(t - 8.5, 0.4))
    const rin = spring(t - 8.9, 0.85)
    mat(repo, rin * (1 - o2), { y: 50 * (1 - rin) + 20 * o2, s: 0.05, blur: 18 })
    rows.forEach((r, i) => { const p = spring(t - 9.2 - i * 0.12, 0.7); r.style.opacity = p; r.style.transform = `translate3d(${(1 - p) * 14}px, 0, 0)` })

    // 3. Code (13-19.2)
    show(s3, t >= 12.8 && t < 19.8)
    const o3 = clamp(spring(t - 19.0, 0.5))
    const h3in = spring(t - 13.0, 0.9)
    mat(h3, h3in * (1 - o3), { y: 24 * (1 - h3in), s: 0.02 })
    const cin = spring(t - 13.3, 0.85)
    mat(code, cin * (1 - o3), { y: 40 * (1 - cin) + 20 * o3, s: 0.05, blur: 18 })
    codeLines.forEach((l, i) => { const p = spring(t - 13.8 - i * 0.22, 0.6); l.style.opacity = p; l.style.transform = `translate3d(${(1 - p) * 12}px, 0, 0)` })
    lines3.forEach((el, i) => { const p = spring(t - 15.9 - i * 0.5, 0.8); mat(el, p * (1 - o3), { y: 30 * (1 - p), s: 0.03, blur: 16 }) })

    // 4. Inside (19.6-25.2)
    show(s4, t >= 19.4 && t < 25.8)
    const o4 = clamp(spring(t - 25.0, 0.5))
    const h4in = spring(t - 19.6, 0.9)
    mat(h4, h4in * (1 - o4), { y: 24 * (1 - h4in), s: 0.02 })
    tiles.forEach((el, i) => { const p = spring(t - 20.0 - i * 0.18, 0.85); mat(el, p * (1 - o4), { y: 50 * (1 - p) + 20 * o4, s: 0.06, blur: 16 }) })
    const mp = spring(t - 22.4, 0.9)
    mat(mit, mp * (1 - o4), { y: 20 * (1 - mp), s: 0.02 })

    // 5. Repo card (25.4-29.6)
    show(s5, t >= 25.2 && t < 30.2)
    const o5 = clamp(spring(t - 29.4, 0.5))
    const h5in = spring(t - 25.4, 0.9)
    mat(h5, h5in * (1 - o5), { y: 24 * (1 - h5in), s: 0.02 })
    const gin = spring(t - 25.7, 0.85)
    mat(gh, gin * (1 - o5), { y: 40 * (1 - gin) + 20 * o5, s: 0.05, blur: 18 })
    const press = t >= 27.2 && t < 27.4 ? 1 : clamp(1 - spring(t - 27.4, 0.3))
    starBtn.classList.toggle('on', t >= 27.3)
    starBtn.style.transform = `scale(${(1 - 0.06 * (t >= 27.2 ? press : 0)).toFixed(3)})`
    starBtn.lastChild.textContent = t >= 27.3 ? 'Starred' : 'Star'
    const s5in = spring(t - 27.8, 0.9)
    mat(sub5, s5in * (1 - o5), { y: 16 * (1 - s5in), s: 0.02 })

    // 6. End card (29.8-32)
    show(s8, t >= 29.6)
    const e1 = spring(t - 29.8, 0.7), e2 = spring(t - 30.15, 0.7), e3 = spring(t - 30.4, 0.7), e4 = spring(t - 30.6, 0.7)
    mat(endLogo, e1, { y: 30 * (1 - e1), s: 0.06, blur: 20 })
    mat(endTag, e2, { y: 20 * (1 - e2), s: 0.02 })
    mat(endUrl, e3, { y: 20 * (1 - e3), s: 0.02 })
    mat(endCa, e4, { y: 20 * (1 - e4), s: 0.02 })

    fade.style.opacity = Math.max(1 - clamp(t / 0.4), clamp((t - (DURATION - 0.4)) / 0.4))
  }
}

build()
await document.fonts.ready
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r }))))
window.DURATION = DURATION
window.renderAt(0)
window.__ready = true
if (new URLSearchParams(location.search).has('play')) { const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }; loop() }
</script>
</body>
</html>
