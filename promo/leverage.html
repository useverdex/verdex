<!doctype html>
<html lang="en">

<style>

/* Panels */
.panel { position: absolute; width: 900px; box-sizing: border-box; padding: 30px 36px 32px; border-radius: 22px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 50px 120px rgba(0,0,0,.7); will-change: transform, opacity, filter; }

/* Bounty tiles */

.pos .top { display: flex; align-items: center; gap: 16px; }

.buy .a { flex: 1; }

.flow { position: absolute; left: 50%; top: 330px; width: 1500px; margin-left: -750px; display: flex; align-items: center; justify-content: center; gap: 0; }
.nd { width: 300px; box-sizing: border-box; padding: 24px 26px; border-radius: 20px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 80px rgba(0,0,0,.6); will-change: transform, opacity, filter; }
.nd b { display: block; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.nd span { display: block; font-size: 15px; color: var(--muted); margin-top: 6px; line-height: 1.35; }

.rt { position: absolute; left: 50%; width: 1180px; margin-left: -590px; display: flex; align-items: center; gap: 22px; height: 86px; padding: 0 26px; box-sizing: border-box; border-radius: 18px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); will-change: transform, opacity, filter; }

.rt .out { font-size: 20px; color: var(--lime); font-weight: 500; }
.two { position: absolute; left: 50%; top: 300px; width: 1400px; margin-left: -700px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
.pos2 { box-sizing: border-box; padding: 28px 32px; border-radius: 22px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 50px 120px rgba(0,0,0,.7); will-change: transform, opacity, filter; }

<body>
<div id="stage"></div>
<script type="module">
// Leverage: the name, a long and a short side by side with the numbers from the fork test, the one-swap flow, what the contract cannot do, the end card. renderAt(t) paints second t.
import { MARK_PATH } from '../src/components/logoPath.ts'
const MARK = (fill = '#C2EA8A') => `<svg viewBox="0 0 100 100" fill="${fill}" style="display:block"><path d="${MARK_PATH}"/></svg>`
const DURATION = 34
const PUB = '../public'
const L = (h) => `${PUB}/img/logos/${h}.webp`
const USDG = `${PUB}/img/tokens/usdg.png`

function spring(t, response = 0.5, damping = 1) {
  if (t <= 0) return 0
  const w = (2 * Math.PI) / response
  if (damping >= 1) return 1 - (1 + w * t) * Math.exp(-w * t)
  const wd = w * Math.sqrt(1 - damping * damping)
  return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + ((damping * w) / wd) * Math.sin(wd * t))
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const easeIO = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2)
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
const mat = (el, p, { y = 0, x = 0, s = 0.04, blur = 14 } = {}) => {
  el.style.opacity = clamp(p)
  el.style.filter = p >= 0.999 ? 'none' : `blur(${((1 - clamp(p)) * blur).toFixed(2)}px)`
  el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - s * (1 - p)})`
}
const letters = (el, text) => { el.innerHTML = ''; return [...text].map((c) => add(el, `<span class="ch${c === ' ' ? ' sp' : ''}">${c === ' ' ? '' : c}</span>`)) }
function wipe(chars, p, { stagger = 0.045, blur = 12, dx = 18, out = 0 } = {}) {
  const n = chars.length
  chars.forEach((c, i) => {
    const q = clamp((p * (1 + stagger * n) - i * stagger)) * (1 - out)
    c.style.opacity = q
    c.style.filter = q >= 0.999 ? 'none' : `blur(${((1 - q) * blur).toFixed(2)}px)`
    c.style.transform = `translate3d(${((1 - q) * dx).toFixed(2)}px, 0, 0)`
  })
}
const show = (el, on) => { el.style.display = on ? '' : 'none' }
const num = (v, d = 0) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })

function build() {
  add(stage, `<div class="grid"></div>`)
  const glow = add(stage, `<div class="abs" style="left:50%;top:50%;width:1400px;height:900px;margin:-450px 0 0 -700px;background:radial-gradient(closest-side,rgba(194,234,138,.13),rgba(194,234,138,0));pointer-events:none"></div>`)

  // 1. The name. (0-5.6)
  const s1 = add(stage, `<div class="scene"></div>`)
  const nameEl = add(s1, `<div class="abs" style="left:0;right:0;top:0;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px"><span style="width:120px;height:120px;display:inline-flex;margin-bottom:20px">${MARK()}</span><span class="serif" style="font-size:150px;line-height:1">Two times.</span><span class="serif" style="font-size:150px;line-height:1;color:var(--lime)">Long or short.</span></div>`)
  const tagEl = add(s1, `<div class="abs" style="left:0;right:0;top:860px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)"><div></div></div>`)
  const tagChars = letters(tagEl.firstElementChild, 'Leverage on tokenized stocks. Onchain. Around the clock.')

  // 2. A long and a short. (5.2-14.4)
  const s2 = add(stage, `<div class="scene"></div>`)
  const h2 = add(s2, `<div class="head" style="top:80px"><h1 class="serif">$100 of margin. Two ways.</h1><p>Numbers from the test on a fork of Robinhood Chain, NVDA at $235. The page shows every line before you sign.</p></div>`)
  const two = add(s2, `<div class="two"></div>`)
  const long = add(two, `<div class="pos2"><span class="tag2 l">Long 1.9x</span><h3>$190 of NVDA</h3><div class="rows2"><div><span>Margin</span><span>$100</span></div><div><span>Borrowed from Lend</span><span class="bl">$0</span></div><div><span>NVDA bought and locked</span><span class="bu">0</span></div><div><span>Health at open</span><span class="lm bh">…</span></div><div><span>Liquidation if NVDA is below</span><span class="rd bq">…</span></div></div></div>`)
  const shrt = add(two, `<div class="pos2"><span class="tag2 s">Short 2x</span><h3>$200 of NVDA</h3><div class="rows2"><div><span>Margin</span><span>$100</span></div><div><span>NVDA borrowed and sold</span><span class="su">0</span></div><div><span>USDG locked</span><span class="sl">$100</span></div><div><span>Health at open</span><span class="lm sh">…</span></div><div><span>Liquidation if NVDA is above</span><span class="rd sq">…</span></div></div></div>`)
  const bl = long.querySelector('.bl'), bu = long.querySelector('.bu'), bh = long.querySelector('.bh'), bq = long.querySelector('.bq')
  const su = shrt.querySelector('.su'), sl = shrt.querySelector('.sl'), sh = shrt.querySelector('.sh'), sq = shrt.querySelector('.sq')
  const cap2 = add(s2, `<div class="cap" style="top:800px">Leverage multiplies a move both ways. Under the line, anyone can liquidate. That risk is yours.</div>`)

  // 3. One swap. (14-23.4)
  const s3 = add(stage, `<div class="scene"></div>`)
  const h3 = add(s3, `<div class="head" style="top:80px"><h1 class="serif">One swap. The pool paid inside the callback.</h1><p>A long buys the stock with margin plus borrowed USDG and locks it in Lend, in the same transaction. A short borrows the stock from Lend, sells it, and locks the USDG next to the margin.</p></div>`)
  const flow = add(s3, `<div class="flow" style="top:340px"></div>`)
  const N = [[`<img src="${USDG}" alt="">`, 'Your margin', '$100 USDG into your own account contract', '$100'], [MARK(), 'Lend', 'the account borrows $90 against the stock it is about to hold', '+$90'], [`<img src="${L('88a0e630')}" alt="">`, 'The pool', '$190 buys 0.808 NVDA, paid in the callback', '0.808'], [`<span class="tile" style="font-size:28px">1</span>`, 'Locked', 'the NVDA is the collateral for the $90 loan. Health 1.37', 'open']]
  const nodes = [], arrows = []
  N.forEach(([ic, b, s, e], i) => { if (i) arrows.push(add(flow, `<div class="arr">→</div>`)); nodes.push(add(flow, `<div class="nd" style="width:330px">${ic}<b>${b}</b><span>${s}</span><em>${e}</em></div>`)) })
  const cap3 = add(s3, `<div class="cap" style="top:760px">Every wallet gets its own account. Every position is its own Lend position. Nothing is pooled with anyone.</div>`)

  // 4. What it cannot do. (23-30.8)
  const s4 = add(stage, `<div class="scene"></div>`)
  const h4 = add(s4, `<div class="head" style="top:90px"><h1 class="serif">What the contract cannot do.</h1><p>Open source, verified, unaudited. The owner keeps caps, fee and treasury and nothing else.</p></div>`)
  const K = [['Hold a position itself', 'every position lives in Lend, in an account that is yours'], ['Pool your margin with anyone', 'one wallet, one account, one liquidation line'], ['Move funds to the owner', 'there is no such function'], ['Open past the cap', 'open interest per market, raised step by step']]
  const rows4 = K.map(([a, b], i) => add(s4, `<div class="row abs" style="left:50%;width:1100px;margin-left:-550px;top:${330 + i * 92}px;height:78px;padding:0 24px;border-radius:16px;background:var(--panel);border:1px solid rgba(255,255,255,.08);font-size:22px"><span class="dot" style="margin:0 6px 0 0;background:var(--red)"></span><span class="t" style="color:#fff">${a}</span><span class="a" style="color:var(--muted);font-weight:400;font-size:18px">${b}</span></div>`))

  // 5. End card. (30.4-34)
  const s5 = add(stage, `<div class="scene"></div>`)
  const endLogo = add(s5, `<div class="abs" style="left:0;right:0;top:300px;display:flex;justify-content:center;align-items:center;gap:36px"><span style="width:160px;height:160px;display:inline-flex;margin-top:16px">${MARK()}</span><span class="serif" style="font-size:240px">Verdex</span></div>`)
  const endTag = add(s5, `<div class="abs" style="left:0;right:0;top:610px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)">Leverage. Live now.</div>`)
  const endUrl = add(s5, `<div class="abs" style="left:0;right:0;top:710px;text-align:center"><span class="pill" style="font-size:30px;padding:14px 26px"><span style="width:14px;height:14px;border-radius:50%;background:var(--lime)"></span>useverdex.xyz/leverage</span></div>`)
  const endCa = add(s5, `<div class="abs" style="left:0;right:0;top:820px;text-align:center"><span class="pill" style="font-size:24px;padding:12px 22px;gap:14px"><span style="color:var(--lime);font-weight:600;letter-spacing:.08em;font-size:18px">CA</span><span style="font-family:var(--mono)">0x96f455a90a80dcf0c2df6703ea4ba3bedf286e43</span></span></div>`)

  const g = document.createElement('canvas'); g.width = 480; g.height = 270
  const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
  gx.putImageData(id, 0, 0)
  add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
  add(stage, `<div id="vignette"></div>`)
  const fade = add(stage, `<div id="fade"></div>`)

  window.renderAt = (t) => {
    glow.style.opacity = 0.5 + 0.5 * Math.sin(t * 0.8)

    show(s1, t < 5.6)
    const pn = spring(t - 0.3, 0.7)
    mat(nameEl, pn * (1 - clamp(spring(t - 4.8, 0.45))), { y: 40 * (1 - pn), s: 0.08, blur: 22 })
    wipe(tagChars, spring(t - 1.6, 0.9), { stagger: 0.03, out: clamp(spring(t - 4.7, 0.4)) })

    show(s2, t >= 5.2 && t < 14.4)
    const o2 = clamp(spring(t - 13.6, 0.5))
    const h2in = spring(t - 5.4, 0.9)
    mat(h2, h2in * (1 - o2), { y: 24 * (1 - h2in), s: 0.02 })
    const cl = spring(t - 5.8, 0.85), cs = spring(t - 6.2, 0.85)
    mat(long, cl * (1 - o2), { y: 40 * (1 - cl), s: 0.05, blur: 18 })
    mat(shrt, cs * (1 - o2), { y: 40 * (1 - cs), s: 0.05, blur: 18 })
    const f = easeIO(clamp((t - 7.0) / 1.6))
    bl.textContent = `$${num(90 * f)}`; bu.textContent = (0.808 * f).toFixed(3)
    bh.textContent = t >= 8.8 ? '1.37' : '…'; bq.textContent = t >= 9.4 ? '$171' : '…'
    su.textContent = (0.851 * f).toFixed(3); sl.textContent = `$${num(100 + 199.9 * f)}`
    sh.textContent = t >= 8.8 ? '1.20' : '…'; sq.textContent = t >= 9.4 ? '$282' : '…'
    const cp2 = spring(t - 10.4, 0.9)
    mat(cap2, cp2 * (1 - o2), { y: 16 * (1 - cp2), s: 0.02 })

    show(s3, t >= 14 && t < 23.4)
    const o3 = clamp(spring(t - 22.6, 0.5))
    const h3in = spring(t - 14.2, 0.9)
    mat(h3, h3in * (1 - o3), { y: 24 * (1 - h3in), s: 0.02 })
    nodes.forEach((el, i) => { const p = spring(t - (14.8 + i * 0.6), 0.85); mat(el, p * (1 - o3), { y: 30 * (1 - p), s: 0.05, blur: 16 }) })
    arrows.forEach((el, i) => { el.style.opacity = clamp(spring(t - (15.1 + i * 0.6), 0.6)) * (1 - o3) })
    const cp3 = spring(t - 18.6, 0.9)
    mat(cap3, cp3 * (1 - o3), { y: 16 * (1 - cp3), s: 0.02 })

    show(s4, t >= 23 && t < 30.8)
    const o4 = clamp(spring(t - 30.2, 0.5))
    const h4in = spring(t - 23.2, 0.9)
    mat(h4, h4in * (1 - o4), { y: 24 * (1 - h4in), s: 0.02 })
    rows4.forEach((el, i) => { const p = spring(t - (23.7 + i * 0.3), 0.85); mat(el, p * (1 - o4), { y: 30 * (1 - p), s: 0.03, blur: 12 }) })

    show(s5, t >= 30.4)
    const e1p = spring(t - 30.6, 0.7), e2p = spring(t - 30.95, 0.7), e3p = spring(t - 31.2, 0.7), e4p = spring(t - 31.4, 0.7)
    mat(endLogo, e1p, { y: 30 * (1 - e1p), s: 0.06, blur: 20 })
    mat(endTag, e2p, { y: 20 * (1 - e2p), s: 0.02 })
    mat(endUrl, e3p, { y: 20 * (1 - e3p), s: 0.02 })
    mat(endCa, e4p, { y: 20 * (1 - e4p), s: 0.02 })

    fade.style.opacity = Math.max(1 - clamp(t / 0.4), clamp((t - (DURATION - 0.4)) / 0.4))
  }
}

build()
await document.fonts.ready
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r }))))
window.DURATION = DURATION
window.renderAt(0)
window.__ready = true
if (new URLSearchParams(location.search).has('play')) { const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }; loop() }
</script>
</body>
</html>
