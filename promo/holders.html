<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VERDEX holder perks film</title>
<style>
@font-face { font-family: Geist; src: url(../src/fonts/Geist-400.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: Geist; src: url(../src/fonts/Geist-500.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: Geist; src: url(../src/fonts/Geist-600.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: 'LT Remark'; src: url(../src/fonts/LT-Remark-400.woff2) format('woff2'); font-weight: 400; }
:root { --bg: #050505; --lime: #C2EA8A; --chip: #1A1A1A; --panel: #0F0F0F; --raised: #161616; --soft: rgba(255,255,255,.72); --muted: rgba(255,255,255,.45); --faint: rgba(255,255,255,.3); --mono: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; }
html, body { margin: 0; background: var(--bg); overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: #fff; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }
.scene { position: absolute; inset: 0; }
.serif { font-family: 'LT Remark', serif; font-weight: 400; letter-spacing: -0.035em; line-height: .98; }
.ch { display: inline-block; will-change: transform, opacity, filter; }
.ch.sp { width: .28em; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 96px 96px; background-position: center; }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 12px; background: var(--chip); font-size: 24px; font-weight: 500; vertical-align: middle; }
.tag { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 6px; background: rgba(255,255,255,.1); color: var(--soft); font-size: 20px; font-weight: 500; letter-spacing: -0.02em; }
.head { position: absolute; left: 0; right: 0; text-align: center; will-change: transform, opacity, filter; }
.head h1 { margin: 0; font-size: 92px; }
.head p { margin: 14px 0 0; font-size: 30px; font-weight: 500; letter-spacing: -0.015em; color: var(--soft); }
.panel { position: absolute; width: 900px; box-sizing: border-box; padding: 30px 36px 32px; border-radius: 22px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 50px 120px rgba(0,0,0,.7); will-change: transform, opacity, filter; }
.panel .hd { display: flex; align-items: center; gap: 16px; }
.panel .hd .ic { width: 50px; height: 50px; border-radius: 14px; background: rgba(255,255,255,.06); display: grid; place-items: center; color: var(--lime); flex-shrink: 0; }
.panel .hd .ic svg { width: 24px; height: 24px; }
.panel .hd b { font-size: 24px; font-weight: 500; display: block; letter-spacing: -0.02em; }
.panel .hd span { font-size: 16px; color: var(--muted); display: block; margin-top: 3px; }
.panel .hd .wal { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 10px; background: var(--chip); font-family: var(--mono); font-size: 18px; color: var(--soft); will-change: opacity, transform, filter; }
.panel .hd .wal i { width: 10px; height: 10px; border-radius: 50%; background: var(--lime); }
.amt { display: flex; align-items: baseline; gap: 16px; margin-top: 26px; }
.amt b { font-family: 'LT Remark', serif; font-weight: 400; font-size: 76px; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.amt span { font-size: 22px; color: var(--muted); }
.rows { margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.08); }
.row { display: flex; align-items: center; gap: 16px; height: 50px; padding: 0 12px; border-radius: 10px; font-size: 20px; will-change: opacity, transform; }
.row .t { flex: 1; color: var(--muted); }
.row .a { font-weight: 500; font-variant-numeric: tabular-nums; position: relative; }
.row .a .old, .row .a .new { will-change: opacity, transform, filter; }
.row .a .new { position: absolute; right: 0; top: 0; white-space: nowrap; color: var(--lime); }
.row .a .new s { color: var(--faint); margin-right: 10px; }
.row.fee { background: rgba(194,234,138,.06); }
.hint { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding: 14px 12px 0; border-top: 1px solid rgba(255,255,255,.08); font-size: 18px; color: var(--muted); will-change: opacity, transform, filter; }
.hint b { color: var(--lime); font-weight: 500; }
/* Feature tiles */
.ft { position: absolute; width: 400px; height: 150px; padding: 26px 28px; box-sizing: border-box; border-radius: 20px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 80px rgba(0,0,0,.6); display: flex; flex-direction: column; justify-content: space-between; will-change: transform, opacity, filter; }
.ft b { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; }
.ft span { font-size: 20px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.ft span em { font-style: normal; color: var(--lime); font-weight: 500; }
.ft span s { color: var(--faint); }
/* Status cards */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 26px; }
.card { padding: 22px 24px; border-radius: 16px; background: var(--raised); display: flex; gap: 16px; align-items: flex-start; will-change: opacity, transform; }
.card .ic { color: var(--lime); width: 26px; height: 26px; flex-shrink: 0; margin-top: 2px; }
.card .ic svg { width: 26px; height: 26px; }
.card b { display: block; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.card span { display: block; font-size: 16px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.card .bar { margin-top: 14px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.card .bar i { display: block; height: 100%; background: var(--lime); border-radius: 3px; }
.gate { text-align: center; padding: 44px 60px 48px; }
.gate .ic { width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,.06); display: grid; place-items: center; color: var(--lime); margin: 0 auto; }
.gate .ic svg { width: 30px; height: 30px; }
.gate h2 { margin: 24px 0 0; font-size: 56px; }
.gate p { margin: 18px 0 0; font-size: 22px; color: var(--soft); line-height: 1.45; }
.gate .btns { display: flex; gap: 14px; justify-content: center; margin-top: 30px; }
.gate .btn { padding: 14px 26px; border-radius: 14px; font-size: 20px; font-weight: 500; background: #fff; color: #000; }
.gate .btn.ghost { background: rgba(255,255,255,.08); color: #fff; }
.cap { position: absolute; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 500; letter-spacing: -0.015em; color: var(--soft); will-change: opacity, transform, filter; }
#grain { position: absolute; inset: 0; pointer-events: none; opacity: .05; mix-blend-mode: overlay; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); }
#fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
// Holder perks film: the claim, a quote whose Verdex fee disappears when the wallet holds VERDEX, the surfaces it covers, the early-access gate, the status panel, the end card. renderAt(t) paints second t.
import { MARK_PATH } from '../src/components/logoPath.ts'
const MARK = (fill = '#C2EA8A') => `<svg viewBox="0 0 100 100" fill="${fill}" style="display:block"><path d="${MARK_PATH}"/></svg>`
const DURATION = 34

function spring(t, response = 0.5, damping = 1) {
  if (t <= 0) return 0
  const w = (2 * Math.PI) / response
  if (damping >= 1) return 1 - (1 + w * t) * Math.exp(-w * t)
  const wd = w * Math.sqrt(1 - damping * damping)
  return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + ((damping * w) / wd) * Math.sin(wd * t))
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const easeIO = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2)
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
const mat = (el, p, { y = 0, x = 0, s = 0.04, blur = 14 } = {}) => {
  el.style.opacity = clamp(p)
  el.style.filter = p >= 0.999 ? 'none' : `blur(${((1 - clamp(p)) * blur).toFixed(2)}px)`
  el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - s * (1 - p)})`
}
const letters = (el, text) => { el.innerHTML = ''; return [...text].map((c) => add(el, `<span class="ch${c === ' ' ? ' sp' : ''}">${c === ' ' ? '' : c}</span>`)) }
function wipe(chars, p, { stagger = 0.045, blur = 12, dx = 18, out = 0 } = {}) {
  const n = chars.length
  chars.forEach((c, i) => {
    const q = clamp((p * (1 + stagger * n) - i * stagger)) * (1 - out)
    c.style.opacity = q
    c.style.filter = q >= 0.999 ? 'none' : `blur(${((1 - q) * blur).toFixed(2)}px)`
    c.style.transform = `translate3d(${((1 - q) * dx).toFixed(2)}px, 0, 0)`
  })
}
const show = (el, on) => { el.style.display = on ? '' : 'none' }
const rise = (el, t, t0, { y = 12, r = 0.6 } = {}) => { const p = spring(t - t0, r); el.style.opacity = clamp(p * 1.4); el.style.transform = `translate3d(0, ${((1 - p) * y).toFixed(2)}px, 0)` }
const I = {
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h.01M3 10h18"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
}

function build() {
  add(stage, `<div class="grid"></div>`)
  const glow = add(stage, `<div class="abs" style="left:50%;top:50%;width:1400px;height:900px;margin:-450px 0 0 -700px;background:radial-gradient(closest-side,rgba(194,234,138,.13),rgba(194,234,138,0));pointer-events:none"></div>`)

  // 1. The claim. (0-5.6)
  const s1 = add(stage, `<div class="scene"></div>`)
  const nameEl = add(s1, `<div class="abs" style="left:0;right:0;top:0;height:1080px;display:flex;align-items:center;justify-content:center;gap:34px"><span style="width:120px;height:120px;display:inline-flex;margin-top:10px">${MARK()}</span><span class="serif" style="font-size:200px">Hold it.</span></div>`)
  const tagEl = add(s1, `<div class="abs" style="left:0;right:0;top:750px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)"><div></div></div>`)
  const tagChars = letters(tagEl.firstElementChild, '$VERDEX now does something.')

  // 2. The quote. (5.2-14)
  const s2 = add(stage, `<div class="scene"></div>`)
  const h2 = add(s2, `<div class="head" style="top:100px"><h1 class="serif">Hold any VERDEX. Pay no Verdex fee.</h1><p>Every trade on Verdex carries a 0.25% fee. Any amount of VERDEX in the wallet takes it to zero.</p></div>`)
  const quote = add(s2, `<div class="panel" style="left:50%;top:330px;margin-left:-450px"><div class="hd"><div class="ic">${I.swap}</div><div><b>Swap</b><span>0.05 ETH to USDG on Robinhood Chain</span></div><span class="wal"><i></i>VERDEX in wallet</span></div>
    <div class="amt"><b>133.72</b><span>USDG</span></div>
    <div class="rows">
      <div class="row"><span class="t">Route</span><span class="a">Nordstern Finance</span></div>
      <div class="row"><span class="t">Minimum received</span><span class="a">133.05 USDG</span></div>
      <div class="row fee"><span class="t">Verdex fee</span><span class="a"><span class="old">0.25% · $0.34</span><span class="new"><s>0.25%</s>0 · VERDEX holder</span></span></div>
      <div class="row"><span class="t">Network fee</span><span class="a">$0.02</span></div>
    </div>
    <div class="hint"><span>Hold any VERDEX and the Verdex fee is 0 on every trade.</span><b>Get VERDEX</b></div></div>`)
  const wal = quote.querySelector('.wal'), feeOld = quote.querySelector('.old'), feeNew = quote.querySelector('.new'), hint = quote.querySelector('.hint'), qRows = [...quote.querySelectorAll('.row')]

  // 3. Everywhere. (14-19.6)
  const s3 = add(stage, `<div class="scene"></div>`)
  const h3 = add(s3, `<div class="head" style="top:110px"><h1 class="serif">On everything.</h1><p>Not one product. Every place Verdex prices a trade reads the same balance first.</p></div>`)
  const F = ['Swap', 'Bridge', 'Private Swap', 'Auto-Invest', 'Orders', 'Vaults', 'Strategies', 'Agent']
  const tiles = F.map((n, i) => add(s3, `<div class="ft" style="left:${120 + (i % 4) * 420}px;top:${380 + Math.floor(i / 4) * 170}px"><b>${n}</b><span><s>0.25%</s><em>0 fee for holders</em></span></div>`))

  // 4. Early access. (19.6-26)
  const s4 = add(stage, `<div class="scene"></div>`)
  const h4 = add(s4, `<div class="head" style="top:90px"><h1 class="serif">Hold 0.5%. Get in first.</h1><p>Every new feature opens to wallets holding 0.5% of the supply before its public date.</p></div>`)
  const gate = add(s4, `<div class="panel gate" style="left:50%;top:330px;margin-left:-450px"><div class="ic">${I.bolt}</div><div style="margin-top:20px"><span class="tag">Early access</span></div><h2 class="serif">The next feature is open to holders first.</h2><p>Wallets holding at least 0.5% of the VERDEX supply can use it now. It opens to everyone on the public date.</p><div class="btns"><span class="btn">Get VERDEX</span><span class="btn ghost">About the token</span></div></div>`)

  // 5. Your wallet. (26-30.6)
  const s5 = add(stage, `<div class="scene"></div>`)
  const h5 = add(s5, `<div class="head" style="top:100px"><h1 class="serif">Checked onchain, every time.</h1><p>No staking contract, no lock, no signup. The site reads your balance from the token contract before each quote.</p></div>`)
  const yw = add(s5, `<div class="panel" style="left:50%;top:330px;margin-left:-450px"><div class="hd"><div class="ic">${I.wallet}</div><div><b>Your wallet</b><span class="bal">0 VERDEX · 0.000% of the supply</span></div></div>
    <div class="cards">
      <div class="card"><div class="ic">${I.check}</div><div><b>No Verdex fee</b><span>Every swap, bridge, plan, order, rebalance and agent trade from this wallet carries no Verdex fee.</span></div></div>
      <div class="card"><div class="ic">${I.bolt}</div><div style="flex:1"><b>Early access</b><span>Every new feature opens for this wallet before its public date.</span><div class="bar"><i style="width:0%"></i></div></div></div>
    </div></div>`)
  const bal = yw.querySelector('.bal'), cards = [...yw.querySelectorAll('.card')], bar = yw.querySelector('.bar i')

  // 6. End card. (30.4-34)
  const s6 = add(stage, `<div class="scene"></div>`)
  const endLogo = add(s6, `<div class="abs" style="left:0;right:0;top:300px;display:flex;justify-content:center;align-items:center;gap:36px"><span style="width:160px;height:160px;display:inline-flex;margin-top:16px">${MARK()}</span><span class="serif" style="font-size:240px">Verdex</span></div>`)
  const endTag = add(s6, `<div class="abs" style="left:0;right:0;top:610px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)">Hold it. Trade with zero Verdex fee.</div>`)
  const endUrl = add(s6, `<div class="abs" style="left:0;right:0;top:710px;text-align:center"><span class="pill" style="font-size:30px;padding:14px 26px"><span style="width:14px;height:14px;border-radius:50%;background:var(--lime)"></span>useverdex.xyz/verdex</span></div>`)
  const endCa = add(s6, `<div class="abs" style="left:0;right:0;top:820px;text-align:center"><span class="pill" style="font-size:24px;padding:12px 22px;gap:14px"><span style="color:var(--lime);font-weight:600;letter-spacing:.08em;font-size:18px">CA</span><span style="font-family:var(--mono)">0x96f455a90a80dcf0c2df6703ea4ba3bedf286e43</span></span></div>`)

  const g = document.createElement('canvas'); g.width = 480; g.height = 270
  const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
  gx.putImageData(id, 0, 0)
  add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
  add(stage, `<div id="vignette"></div>`)
  const fade = add(stage, `<div id="fade"></div>`)

  window.renderAt = (t) => {
    glow.style.opacity = 0.5 + 0.5 * Math.sin(t * 0.8)

    // 1. (0-5.6)
    show(s1, t < 5.6)
    const pn = spring(t - 0.3, 0.7)
    mat(nameEl, pn * (1 - clamp(spring(t - 4.8, 0.45))), { y: 40 * (1 - pn), s: 0.08, blur: 22 })
    wipe(tagChars, spring(t - 1.4, 0.9), { stagger: 0.03, out: clamp(spring(t - 4.7, 0.4)) })

    // 2. Quote (5.2-14)
    show(s2, t >= 5.2 && t < 14.2)
    const o2 = clamp(spring(t - 13.4, 0.5))
    const h2in = spring(t - 5.4, 0.9)
    mat(h2, h2in * (1 - o2), { y: 24 * (1 - h2in), s: 0.02 })
    const q2 = spring(t - 5.7, 0.85)
    mat(quote, q2 * (1 - o2), { y: 40 * (1 - q2) + 20 * o2, s: 0.05, blur: 18 })
    qRows.forEach((r, i) => rise(r, t, 6.3 + i * 0.25))
    const hp = spring(t - 7.4, 0.8)
    mat(hint, hp, { y: 10 * (1 - hp), s: 0.01, blur: 8 })
    // The wallet chip lands at 9.4 and the fee flips.
    const wp = spring(t - 9.4, 0.7)
    mat(wal, wp, { y: -14 * (1 - wp), s: 0.1, blur: 10 })
    const flip = spring(t - 9.9, 0.7)
    mat(feeOld, 1 - flip, { y: 10 * flip, s: 0, blur: 10 })
    mat(feeNew, flip, { y: -10 * (1 - flip), s: 0, blur: 10 })
    hint.style.opacity = clamp(hp) * (1 - clamp(spring(t - 10.2, 0.6)))

    // 3. Everywhere (14-19.6)
    show(s3, t >= 14 && t < 20)
    const o3 = clamp(spring(t - 19.2, 0.5))
    const h3in = spring(t - 14.2, 0.9)
    mat(h3, h3in * (1 - o3), { y: 24 * (1 - h3in), s: 0.02 })
    tiles.forEach((el, i) => { const p = spring(t - 14.5 - i * 0.16, 0.85); mat(el, p * (1 - o3), { y: 50 * (1 - p) + 20 * o3, s: 0.06, blur: 16 }) })

    // 4. Early access (19.6-26)
    show(s4, t >= 19.6 && t < 26.4)
    const o4 = clamp(spring(t - 25.6, 0.5))
    const h4in = spring(t - 19.8, 0.9)
    mat(h4, h4in * (1 - o4), { y: 24 * (1 - h4in), s: 0.02 })
    const g4 = spring(t - 20.1, 0.85)
    mat(gate, g4 * (1 - o4), { y: 40 * (1 - g4) + 20 * o4, s: 0.05, blur: 18 })

    // 5. Your wallet (26-30.6)
    show(s5, t >= 26 && t < 30.8)
    const o5 = clamp(spring(t - 30.2, 0.5))
    const h5in = spring(t - 26.2, 0.9)
    mat(h5, h5in * (1 - o5), { y: 24 * (1 - h5in), s: 0.02 })
    const w5 = spring(t - 26.5, 0.85)
    mat(yw, w5 * (1 - o5), { y: 40 * (1 - w5) + 20 * o5, s: 0.05, blur: 18 })
    const bq = easeIO(clamp((t - 27.0) / 1.6))
    const v = 5_400_000 * bq
    bal.textContent = `${Math.round(v).toLocaleString('en-US')} VERDEX · ${((v / 1e9) * 100).toFixed(3)}% of the supply`
    cards.forEach((c, i) => rise(c, t, 27.3 + i * 0.3))
    bar.style.width = `${(100 * easeIO(clamp((t - 27.8) / 1.4))).toFixed(1)}%`

    // 6. End (30.4-34)
    show(s6, t >= 30.4)
    const e1p = spring(t - 30.6, 0.7), e2p = spring(t - 30.95, 0.7), e3p = spring(t - 31.2, 0.7), e4p = spring(t - 31.4, 0.7)
    mat(endLogo, e1p, { y: 30 * (1 - e1p), s: 0.06, blur: 20 })
    mat(endTag, e2p, { y: 20 * (1 - e2p), s: 0.02 })
    mat(endUrl, e3p, { y: 20 * (1 - e3p), s: 0.02 })
    mat(endCa, e4p, { y: 20 * (1 - e4p), s: 0.02 })

    fade.style.opacity = Math.max(1 - clamp(t / 0.4), clamp((t - (DURATION - 0.4)) / 0.4))
  }
}

build()
await document.fonts.ready
window.DURATION = DURATION
window.renderAt(0)
window.__ready = true
if (new URLSearchParams(location.search).has('play')) { const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }; loop() }
</script>
</body>
</html>
