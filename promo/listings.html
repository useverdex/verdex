<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Verdex listings still</title>
<style>
@font-face { font-family: Geist; src: url(../src/fonts/Geist-400.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: Geist; src: url(../src/fonts/Geist-500.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: Geist; src: url(../src/fonts/Geist-600.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: 'LT Remark'; src: url(../src/fonts/LT-Remark-400.woff2) format('woff2'); font-weight: 400; }
:root { --bg: #050505; --lime: #C2EA8A; --chip: #1A1A1A; --tile: #171717; --panel: #0F0F0F; --soft: rgba(255,255,255,.72); --muted: rgba(255,255,255,.45); --faint: rgba(255,255,255,.3); --mono: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; }
html, body { margin: 0; background: var(--bg); overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: #fff; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }
.serif { font-family: 'LT Remark', serif; font-weight: 400; letter-spacing: -0.035em; line-height: .98; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 96px 96px; background-position: center; }
.head { position: absolute; left: 0; right: 0; top: 110px; text-align: center; }
.head h1 { margin: 0; font-size: 120px; }
.head p { margin: 16px 0 0; font-size: 32px; font-weight: 500; letter-spacing: -0.015em; color: var(--soft); }
.panel { position: absolute; left: 50%; top: 360px; width: 1160px; margin-left: -580px; padding: 26px 32px 30px; box-sizing: border-box; border-radius: 22px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 50px 120px rgba(0,0,0,.7); }
.lab { font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.45); margin-bottom: 14px; }
.row { display: flex; align-items: center; gap: 20px; height: 76px; padding: 0 24px; border-radius: 14px; background: var(--tile); margin-top: 10px; }
.row .ic { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.06); display: grid; place-items: center; font-size: 17px; font-weight: 700; color: var(--soft); flex-shrink: 0; }
.row b { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; width: 320px; }
.row .sub { font-size: 19px; color: var(--muted); flex: 1; }
.row .st { margin-left: auto; padding: 8px 14px; border-radius: 8px; font-size: 17px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.row .st.live { background: rgba(194,234,138,.16); color: var(--lime); }
.row .st.now { background: rgba(255,255,255,.1); color: #fff; }
.row .st.wait { background: rgba(255,255,255,.06); color: var(--muted); }
.foot { position: absolute; left: 0; right: 0; top: 940px; text-align: center; font-size: 26px; font-weight: 500; color: var(--soft); }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 12px; background: var(--chip); font-size: 26px; font-weight: 500; }
.mk { position: absolute; left: 50%; top: 250px; width: 70px; height: 70px; margin-left: -35px; border-radius: 18px; background: #000; border: 1px solid rgba(255,255,255,.16); display: grid; place-items: center; }
#grain { position: absolute; inset: 0; pointer-events: none; opacity: .05; mix-blend-mode: overlay; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { MARK_PATH } from '../src/components/logoPath.ts'
const MARK = (fill = '#C2EA8A') => `<svg viewBox="0 0 100 100" fill="${fill}" style="display:block"><path d="${MARK_PATH}"/></svg>`
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
add(stage, `<div class="grid"></div>`)
add(stage, `<div class="abs" style="left:50%;top:50%;width:1500px;height:900px;margin:-450px 0 0 -750px;background:radial-gradient(closest-side,rgba(194,234,138,.13),rgba(194,234,138,0))"></div>`)
add(stage, `<div class="head"><h1 class="serif">Listings.</h1><p>Applications start today. Free ones first.</p></div>`)
const ROWS = [['DS', 'DexScreener', 'VERDEX and its pools, with token info', 'live', 'Live'], ['CG', 'CoinGecko', 'Free listing application, filed today', 'now', 'Applying today'], ['CMC', 'CoinMarketCap', 'Free listing application, filed today', 'now', 'Applying today'], ['DT', 'DEXTools', 'Token info and socials update', 'now', 'Applying today'], ['GT', 'GeckoTerminal', 'Automatic once the chain is indexed', 'wait', 'Waiting on chain support']]
add(stage, `<div class="panel"><div class="lab">VERDEX · 0x96f4…6e43 · Robinhood Chain</div>${ROWS.map(([ic, nm, sub, k, st]) => `<div class="row"><span class="ic">${ic}</span><b>${nm}</b><span class="sub">${sub}</span><span class="st ${k}">${st}</span></div>`).join('')}</div>`)
add(stage, `<div class="foot"><span class="pill"><span style="width:14px;height:14px;border-radius:50%;background:var(--lime)"></span>useverdex.xyz · the only CA is the one on the site</span></div>`)
const g = document.createElement('canvas'); g.width = 480; g.height = 270
const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
gx.putImageData(id, 0, 0)
add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
add(stage, `<div id="vignette"></div>`)
window.renderAt = () => {}
window.DURATION = 1
await document.fonts.ready
window.__ready = true
</script>
</body>
</html>
