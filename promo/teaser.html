<style>

<body>
<div id="stage"></div>
<script type="module">
// Teaser still: the next feature's card and chart, blurred past reading, under the line and the time. ?line=…&sub=…

const tag = q.get('tag')
const accent = q.get('accent') === '1'

const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
add(stage, `<div class="grid"></div>`)
add(stage, `<div class="abs" style="left:50%;top:50%;width:1500px;height:900px;margin:-450px 0 0 -750px;background:radial-gradient(closest-side,rgba(194,234,138,.16),rgba(194,234,138,0))"></div>`)

}
if (bg === 'yield') {
  const ROWS = [['88a0e630.webp', 'NVDA', 'NVIDIA', '12 shares', '+$0.84 today'], ['', 'SPY', 'S&P 500', '4 shares', '+$0.31 today'], ['', 'AAPL', 'Apple', '20 shares', '+$0.62 today'], ['', 'USDG', 'Cash', '$2,400', '+$0.23 today']]
  add(stage, `<div class="card" style="top:140px;width:1080px;margin-left:-540px;transform:rotate(-3deg) scale(1.02)"><div class="lab">Your wallet · earning</div>${ROWS.map(([img, t, n, q, e], i) => `<div class="row" style="display:flex;align-items:center;gap:18px;height:72px;padding:0 20px;border-radius:12px;background:var(--tile);margin-top:${i ? 12 : 0}px"><span style="width:40px;height:40px;border-radius:50%;background:${img ? '' : '#2a2a2a'};overflow:hidden;display:inline-flex">${img ? `<img src="../public/img/logos/${img}" style="width:40px;height:40px">` : ''}</span><b style="font-size:22px;width:110px">${t}</b><span style="font-size:18px;color:var(--muted);width:200px">${n}</span><span style="font-size:18px;color:var(--soft);width:170px">${q}</span><span class="chip lime" style="height:36px;padding:0 14px;font-size:17px">Earning</span><span style="font-size:19px;color:var(--lime);margin-left:auto">${e}</span></div>`).join('')}</div>`)

    <div class="row" style="display:flex;gap:14px;margin-top:18px"><div style="flex:1;padding:16px 18px;border-radius:12px;background:var(--tile)"><div style="font-size:14px;color:var(--muted)">Creator fee</div><div style="font-size:24px;font-weight:500;margin-top:6px">2% of every trade, forever</div></div><div style="flex:1;padding:16px 18px;border-radius:12px;background:var(--tile)"><div style="font-size:14px;color:var(--muted)">First buy</div><div style="font-size:24px;font-weight:500;margin-top:6px">0.5 NVDA</div></div></div>
    <span class="btn">Launch</span></div>`)

if (bg === 'treasury') {

}
if (bg === 'private') {
  const ROWS = [['SpaceX', 'SPCX', '4 issuers · 8 chains', '$151.14'], ['OpenAI', '????', 'soon', ''], ['Anthropic', '????', 'soon', ''], ['Stripe', '????', 'soon', '']]
  add(stage, `<div class="card" style="top:150px;width:1000px;margin-left:-500px;transform:rotate(-3deg) scale(1.02)"><div class="lab">Private markets · companies you cannot buy on an exchange</div>${ROWS.map(([n, t, d, pr], i) => `<div class="row" style="display:flex;align-items:center;gap:18px;height:72px;padding:0 20px;border-radius:12px;background:var(--tile);margin-top:${i ? 12 : 0}px"><span style="width:40px;height:40px;border-radius:50%;background:#2a2a2a;display:inline-flex"></span><b style="font-size:24px;width:200px">${n}</b><span style="font-size:18px;color:var(--muted);width:120px">${t}</span><span style="font-size:18px;color:var(--soft);flex:1">${d}</span><span style="font-size:22px;font-weight:500">${pr}</span></div>`).join('')}</div>`)
}
const PATH = [224, 227, 229, 227, 232, 234, 230, 229, 225, 222, 220, 221, 218, 215, 212, 211, 209, 208]
const pts = PATH.map((v, i) => [(i / (PATH.length - 1)) * 1440, 420 - ((v - 200) / 40) * 420])
if (bg === 'solana') {
  const ROWS = [['NVDAx', 'NVIDIA', '$235.65', 'Whirlpool'], ['AAPLx', 'Apple', '$332.34', 'Raydium'], ['MSFTx', 'Microsoft', '$514.02', 'Raydium'], ['GOOGLx', 'Alphabet', '$343.07', 'Manifest'], ['AMZNx', 'Amazon', '$251.22', 'Meteora'], ['METAx', 'Meta', '$726.51', 'Manifest'], ['TSLAx', 'Tesla', '$373.06', 'Whirlpool']]
  add(stage, `<div class="card" style="top:110px;width:1060px;margin-left:-530px;transform:rotate(-3deg) scale(1.02)"><div class="lab">Verdex Magnificent Seven · VX7 on Solana · 7 legs, one signature</div>${ROWS.map(([t, n, pr, v], i) => `<div class="row" style="display:flex;align-items:center;gap:18px;height:62px;padding:0 20px;border-radius:12px;background:var(--tile);margin-top:${i ? 10 : 0}px"><b style="font-size:22px;width:130px">${t}</b><span style="font-size:18px;color:var(--muted);width:200px">${n}</span><span style="font-size:19px;color:var(--soft);width:160px">${pr}</span><span class="chip lime" style="height:34px;padding:0 12px;font-size:16px">Jupiter · ${v}</span><span style="font-size:19px;color:var(--lime);margin-left:auto">14.3%</span></div>`).join('')}</div>`)
}
if (bg === 'base') {
  const ROWS = [['AAPLc', 'Apple', '$332.51', '14.3%'], ['MSFTc', 'Microsoft', '$514.39', '14.3%'], ['GOOGLc', 'Alphabet', '$343.33', '14.3%'], ['AMZNc', 'Amazon', '$251.18', '14.3%'], ['NVDAc', 'NVIDIA', '$235.47', '14.3%'], ['METAc', 'Meta', '$725.97', '14.3%'], ['TSLAc', 'Tesla', '$371.96', '14.3%']]
  add(stage, `<div class="card" style="top:110px;width:1060px;margin-left:-530px;transform:rotate(-3deg) scale(1.02)"><div class="lab">Verdex Magnificent Seven · VX7 on Base · paid in USDC</div>${ROWS.map(([t, n, pr, w], i) => `<div class="row" style="display:flex;align-items:center;gap:18px;height:62px;padding:0 20px;border-radius:12px;background:var(--tile);margin-top:${i ? 10 : 0}px"><b style="font-size:22px;width:130px">${t}</b><span style="font-size:18px;color:var(--muted);width:200px">${n}</span><span style="font-size:19px;color:var(--soft);width:160px">${pr}</span><span class="chip lime" style="height:34px;padding:0 12px;font-size:16px">Aerodrome</span><span style="font-size:19px;color:var(--lime);margin-left:auto">${w}</span></div>`).join('')}</div>`)
}
if (bg !== 'audit' && bg !== 'yield' && bg !== 'launch' && bg !== 'private' && bg !== 'treasury' && bg !== 'base' && bg !== 'solana') add(stage, `<div class="chart"><svg viewBox="0 0 1440 420" preserveAspectRatio="none"><line x1="0" x2="1440" y1="${420 - ((210 - 200) / 40) * 420}" y2="${420 - ((210 - 200) / 40) * 420}" stroke="#C2EA8A" stroke-width="3" stroke-dasharray="12 12" opacity=".8"/><path d="${pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]} ${p[1]}`).join(' ')}" fill="none" stroke="#fff" stroke-width="5"/></svg></div>`)
if (bg !== 'audit' && bg !== 'yield' && bg !== 'launch' && bg !== 'private' && bg !== 'treasury' && bg !== 'base' && bg !== 'solana') add(stage, `<div class="card">
  <div class="chips"><span class="chip on">Buy</span><span class="chip">Sell</span></div>
  <div class="row"><div class="lab">Buy</div><div class="buy"><img src="../public/img/logos/88a0e630.webp" alt=""><div><b>NVDA</b><span>NVIDIA · $228.92 now</span></div></div></div>
  <div class="row"><div class="lab">When the price is</div><div class="chips"><span class="chip on">Below</span><span class="chip">Above</span><span class="chip lime">$ 210</span></div></div>
  <div class="row"><div class="lab">Amount</div><div class="chips"><span class="chip">$50</span><span class="chip">$100</span><span class="chip">$250</span><span class="chip on">$500</span><span class="chip">$1000</span></div></div>
  <span class="btn">Place order</span>
</div>`)
add(stage, `<div class="fg"><div class="mk"><span style="width:70px;height:70px;display:inline-flex">${MARK()}</span></div>${tag ? `<span class="pill" style="margin-bottom:26px;color:var(--lime);letter-spacing:.08em;text-transform:uppercase;font-size:22px"><span style="width:14px;height:14px;border-radius:50%;background:var(--lime);box-shadow:0 0 18px var(--lime)"></span>${tag}</span>` : ''}<h1 class="serif"${accent ? ' style="color:var(--lime)"' : ''}>${line}</h1><p>${sub}</p><span class="pill" style="margin-top:22px"><span style="width:14px;height:14px;border-radius:50%;background:var(--lime)"></span>useverdex.xyz</span></div>`)
const g = document.createElement('canvas'); g.width = 480; g.height = 270
const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
gx.putImageData(id, 0, 0)
add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
add(stage, `<div id="vignette"></div>`)
window.renderAt = () => {}
window.DURATION = 1
await document.fonts.ready
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r }))))
window.__ready = true
</script>
