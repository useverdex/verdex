<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Verdex Orders reveal</title>
<style>
@font-face { font-family: Geist; src: url(../src/fonts/Geist-400.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: Geist; src: url(../src/fonts/Geist-500.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: Geist; src: url(../src/fonts/Geist-600.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: 'LT Remark'; src: url(../src/fonts/LT-Remark-400.woff2) format('woff2'); font-weight: 400; }
:root { --bg: #050505; --lime: #C2EA8A; --chip: #1A1A1A; --tile: #171717; --panel: #0F0F0F; --soft: rgba(255,255,255,.72); --muted: rgba(255,255,255,.45); --faint: rgba(255,255,255,.3); --red: #F87171; --mono: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; }
html, body { margin: 0; background: var(--bg); overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: #fff; font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }
.scene { position: absolute; inset: 0; }
.serif { font-family: 'LT Remark', serif; font-weight: 400; letter-spacing: -0.035em; line-height: .98; }
.ch { display: inline-block; will-change: transform, opacity, filter; }
.ch.sp { width: .28em; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 96px 96px; background-position: center; }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 12px; background: var(--chip); font-size: 24px; font-weight: 500; vertical-align: middle; }
.tag { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 6px; background: rgba(255,255,255,.1); color: var(--soft); font-size: 20px; font-weight: 500; letter-spacing: -0.02em; }
.head { position: absolute; left: 0; right: 0; text-align: center; will-change: transform, opacity, filter; }
.head h1 { margin: 0; font-size: 92px; }
.head p { margin: 14px 0 0; font-size: 30px; font-weight: 500; letter-spacing: -0.015em; color: var(--soft); }
/* Order form card */
.card { position: absolute; left: 50%; top: 290px; width: 940px; margin-left: -470px; padding: 34px 40px 38px; box-sizing: border-box; border-radius: 22px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 50px 120px rgba(0,0,0,.7); will-change: transform, opacity, filter; }
.card .lab { font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-bottom: 12px; }
.card .buy { display: flex; align-items: center; gap: 16px; height: 76px; padding: 0 20px; border-radius: 12px; background: var(--tile); }
.card .buy img { width: 40px; height: 40px; border-radius: 50%; }
.card .buy b { font-size: 23px; font-weight: 500; display: block; }
.card .buy span { font-size: 16px; color: var(--muted); }
.card .row { margin-top: 24px; }
.card .chips { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 9px; height: 46px; padding: 0 18px; border-radius: 10px; background: var(--chip); color: rgba(255,255,255,.8); font-size: 19px; font-weight: 500; letter-spacing: -0.02em; will-change: transform, background, color; }
.chip img { width: 20px; height: 20px; border-radius: 50%; }
.chip.on { background: #fff; color: #000; }
.chip.in { background: var(--tile); font-family: var(--mono); }
.chip.in i { font-style: normal; color: var(--faint); margin-right: 6px; }
.btn { display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 26px; border-radius: 12px; font-size: 20px; font-weight: 500; letter-spacing: -0.02em; will-change: transform, background; }
.btn.pri { background: #fff; color: #000; }
.btn.sec { background: rgba(255,255,255,.1); color: #fff; }
.card .btns { display: flex; gap: 14px; margin-top: 32px; }
.toast { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 22px 16px 18px; border-radius: 16px; background: #161616; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 20px 60px rgba(0,0,0,.6); font-size: 22px; font-weight: 500; will-change: transform, opacity; }
.toast .ok { width: 30px; height: 30px; border-radius: 50%; background: var(--lime); color: #052; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex-shrink: 0; }
.toast .mk { width: 40px; height: 40px; border-radius: 10px; background: #000; border: 1px solid rgba(255,255,255,.14); display: grid; place-items: center; flex-shrink: 0; }
.toast .sub { display: block; font-size: 17px; color: var(--muted); font-weight: 400; margin-top: 3px; }
/* Chart */
.chart { position: absolute; left: 160px; top: 300px; width: 1600px; height: 520px; will-change: opacity, transform, filter; }
.chart svg { width: 100%; height: 100%; overflow: visible; }
.lvl { position: absolute; left: 0; transform: translateY(-50%); display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 8px; font-size: 18px; font-weight: 600; letter-spacing: .02em; will-change: opacity, transform; }
.lvl.buy { background: rgba(194,234,138,.16); color: var(--lime); }
.lvl.sell { background: rgba(248,113,113,.16); color: var(--red); }
.now { position: absolute; display: flex; flex-direction: column; align-items: flex-start; will-change: transform, opacity; }
.now b { font-family: 'LT Remark', serif; font-weight: 400; font-size: 64px; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.now span { font-size: 18px; color: var(--muted); font-weight: 500; margin-top: 4px; }
.days { position: absolute; left: 160px; right: 160px; top: 850px; display: flex; justify-content: space-between; font-size: 16px; color: var(--faint); font-weight: 500; will-change: opacity; }
/* Order card (status) */
.ocard { position: absolute; left: 50%; top: 300px; width: 960px; margin-left: -480px; padding: 30px 36px 34px; box-sizing: border-box; border-radius: 22px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 50px 120px rgba(0,0,0,.7); will-change: transform, opacity, filter, border-color; }
.ocard.hot { border-color: rgba(194,234,138,.4); }
.ocard .hd { display: flex; align-items: center; gap: 16px; }
.ocard .hd img { width: 52px; height: 52px; border-radius: 50%; }
.ocard .nm b { font-size: 26px; font-weight: 500; display: block; letter-spacing: -0.02em; }
.ocard .nm span { font-size: 17px; color: var(--muted); display: block; margin-top: 3px; }
.badge { margin-left: auto; padding: 7px 13px; border-radius: 6px; background: rgba(255,255,255,.1); font-size: 18px; font-weight: 500; color: var(--soft); will-change: transform; white-space: nowrap; }
.badge.hot { background: rgba(194,234,138,.16); color: var(--lime); }
.badge.done { background: rgba(194,234,138,.1); color: #8FA661; }
.ocard .meta { display: flex; justify-content: space-between; margin-top: 26px; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ocard .meta em { font-style: normal; color: var(--lime); }
.rail { position: relative; height: 30px; margin-top: 16px; }
.rail .ln { position: absolute; left: 0; right: 0; top: 14px; height: 2px; background: rgba(255,255,255,.14); }
.rail .dot { position: absolute; top: 8px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translateX(-50%); will-change: left; }
.rail .tick { position: absolute; top: 4px; width: 3px; height: 22px; background: var(--lime); transform: translateX(-50%); }
.ocard .btns { display: flex; gap: 12px; margin-top: 28px; }
.ocard .fill { margin-top: 22px; font-size: 18px; color: var(--muted); display: flex; align-items: center; gap: 10px; will-change: opacity, transform; }
.ocard .fill img { width: 22px; height: 22px; border-radius: 50%; }
.ocard .fill .ck { color: var(--lime); font-weight: 600; margin-left: auto; }
/* Types */
.type { position: absolute; width: 400px; height: 210px; padding: 26px 28px; box-sizing: border-box; border-radius: 20px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 80px rgba(0,0,0,.6); will-change: transform, opacity, filter; }
.type .ar { width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,.06); display: grid; place-items: center; font-size: 26px; font-weight: 600; }
.type .ar.b { color: var(--lime); } .type .ar.s { color: var(--red); }
.type b { display: block; font-size: 27px; font-weight: 500; letter-spacing: -0.02em; margin-top: 18px; }
.type span { display: block; font-size: 17px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
/* Lines */
.line { position: absolute; left: 0; right: 0; display: flex; justify-content: center; will-change: transform, opacity, filter; }
.line div { display: flex; align-items: center; gap: 22px; padding: 22px 34px; border-radius: 18px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); font-size: 36px; font-weight: 500; letter-spacing: -0.02em; }
.line svg { width: 34px; height: 34px; flex-shrink: 0; }
/* Fee */
.feebox { position: absolute; left: 50%; top: 600px; width: 900px; margin-left: -450px; padding: 30px 40px; box-sizing: border-box; border-radius: 22px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: space-between; font-size: 30px; font-weight: 500; will-change: transform, opacity, filter; }
.feebox .old { position: relative; color: var(--faint); }
.feebox .old i { position: absolute; left: 0; top: 50%; height: 3px; width: 0; background: rgba(255,255,255,.6); }
.feebox .new { color: var(--lime); font-family: 'LT Remark', serif; font-size: 64px; letter-spacing: -0.03em; line-height: 1; will-change: transform, opacity; }
#grain { position: absolute; inset: 0; pointer-events: none; opacity: .05; mix-blend-mode: overlay; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); }
#fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
// Orders reveal: name the price, the form, the chart crossing the level, the fill, four types, non-custodial, fee, end card. renderAt(t) paints second t.
import { MARK_PATH } from '../src/components/logoPath.ts'
const MARK = (fill = '#C2EA8A') => `<svg viewBox="0 0 100 100" fill="${fill}" style="display:block"><path d="${MARK_PATH}"/></svg>`
const PUB = '../public'
const L = (h) => `${PUB}/img/logos/${h}.webp`
const CH = (id) => `${PUB}/logos/chains/${id}.svg`
const TOOL = (k) => `${PUB}/logos/tools/${k}.svg`
const NVDA = L('88a0e630')
const DURATION = 40

function spring(t, response = 0.5, damping = 1) {
  if (t <= 0) return 0
  const w = (2 * Math.PI) / response
  if (damping >= 1) return 1 - (1 + w * t) * Math.exp(-w * t)
  const wd = w * Math.sqrt(1 - damping * damping)
  return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + ((damping * w) / wd) * Math.sin(wd * t))
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, p) => a + (b - a) * p
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
const mat = (el, p, { y = 0, x = 0, s = 0.04, blur = 14 } = {}) => {
  el.style.opacity = clamp(p)
  el.style.filter = p >= 0.999 ? 'none' : `blur(${((1 - clamp(p)) * blur).toFixed(2)}px)`
  el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - s * (1 - p)})`
}
const letters = (el, text) => { el.innerHTML = ''; return [...text].map((c) => add(el, `<span class="ch${c === ' ' ? ' sp' : ''}">${c === ' ' ? '' : c}</span>`)) }
function wipe(chars, p, { stagger = 0.045, blur = 12, dx = 18, out = 0 } = {}) {
  const n = chars.length
  chars.forEach((c, i) => {
    const q = clamp((p * (1 + stagger * n) - i * stagger)) * (1 - out)
    c.style.opacity = q
    c.style.filter = q >= 0.999 ? 'none' : `blur(${((1 - q) * blur).toFixed(2)}px)`
    c.style.transform = `translate3d(${((1 - q) * dx).toFixed(2)}px, 0, 0)`
  })
}
const show = (el, on) => { el.style.display = on ? '' : 'none' }
const usd = (v, d = 2) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })
const pressAt = (btn, t, t0, light = '#E6E1DA') => { const press = t >= t0 && t < t0 + 0.2 ? 1 : clamp(1 - spring(t - t0 - 0.2, 0.3)); btn.style.transform = `scale(${(1 - 0.05 * (t >= t0 ? press : 0)).toFixed(3)})`; btn.style.background = t >= t0 && press > 0.5 ? light : '#fff' }
const toastIn = (el, t, t0, t1, centred = false) => { const p = spring(t - t0, 0.55, 0.7), o = clamp(spring(t - t1, 0.45)); el.style.opacity = clamp(p * 2) * (1 - o); el.style.transform = `translate3d(${centred ? '-50%' : '0'}, ${((1 - p) * 30 - o * 14).toFixed(2)}px, 0) scale(${lerp(0.94, 1, p).toFixed(3)})` }
const pick = (list, idx, t0, t) => list.forEach((c, i) => { const p = spring(t - t0, 0.35, 0.6); const on = i === idx && t >= t0; c.classList.toggle('on', on); c.style.transform = on ? `scale(${(1 + 0.08 * (1 - p)).toFixed(3)})` : 'none' })
const LOCK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'

// A simulated NVDA path over eight days: from 224 it wanders up, then sells off through the 210 level.
const P0 = 224.32, LEVEL = 210
const PATH = [224.32, 226.8, 229.4, 227.1, 231.6, 233.9, 230.2, 228.7, 225.1, 222.4, 219.8, 221.3, 217.6, 214.9, 212.2, 211.0, 209.4, 208.1]
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Mon', 'Tue', 'Wed']
const pathAt = (p) => { const x = clamp(p) * (PATH.length - 1); const i = Math.floor(x); return i >= PATH.length - 1 ? PATH[PATH.length - 1] : lerp(PATH[i], PATH[i + 1], x - i) }
let CROSS = 1
for (let x = 0; x <= 1; x += 0.001) { if (pathAt(x) <= LEVEL) { CROSS = x; break } }

function build() {
  add(stage, `<div class="grid"></div>`)
  const glow = add(stage, `<div class="abs" style="left:50%;top:50%;width:1400px;height:900px;margin:-450px 0 0 -700px;background:radial-gradient(closest-side,rgba(194,234,138,.13),rgba(194,234,138,0));pointer-events:none"></div>`)

  // 1. New on Verdex, then the name.
  const s1 = add(stage, `<div class="scene"></div>`)
  const comingEl = add(s1, `<div class="abs" style="left:0;right:0;top:0;height:1080px;display:grid;place-items:center;font-size:44px;font-weight:500;letter-spacing:-0.01em;color:var(--soft)"><div></div></div>`)
  const comingChars = letters(comingEl.firstElementChild, 'New on Verdex')
  const nameEl = add(s1, `<div class="abs" style="left:0;right:0;top:0;height:1080px;display:flex;align-items:center;justify-content:center;gap:34px"><span style="width:130px;height:130px;display:inline-flex;margin-top:10px">${MARK()}</span><span class="serif" style="font-size:230px">Orders</span></div>`)
  const tagEl = add(s1, `<div class="abs" style="left:0;right:0;top:760px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)"><div></div></div>`)
  const tagChars = letters(tagEl.firstElementChild, 'Name your price. Keep your keys.')

  // 2. The order form fills itself in.
  const s2 = add(stage, `<div class="scene"></div>`)
  const h2 = add(s2, `<div class="head" style="top:110px"><h1 class="serif">Name your price.</h1><p>Buy below, buy above, sell above, sell below. Any tokenized stock, ETF or commodity.</p></div>`)
  const card = add(s2, `<div class="card">
    <div class="chips" data-k="side"><span class="chip">Buy</span><span class="chip">Sell</span></div>
    <div class="row"><div class="lab">Buy</div><div class="buy"><img src="${NVDA}" alt=""><div><b>NVDA</b><span>NVIDIA · ${usd(P0)} now</span></div></div></div>
    <div class="row"><div class="lab">When the price is</div><div class="chips" data-k="trig"><span class="chip">Below</span><span class="chip">Above</span><span class="chip in"><i>$</i><span class="lv">224</span></span></div></div>
    <div class="row"><div class="lab">Amount</div><div class="chips" data-k="amt">${[50, 100, 250, 500, 1000].map((a) => `<span class="chip">$${a}</span>`).join('')}</div></div>
    <div class="row"><div class="lab">Pay with</div><div class="chips" data-k="pay">${[['USDG on Robinhood Chain', 4663], ['USDC on Base', 8453], ['USDC on Arbitrum', 42161]].map(([a, c]) => `<span class="chip"><img src="${CH(c)}" alt="">${a}</span>`).join('')}</div></div>
    <div class="btns"><span class="btn pri">${LOCK}Place order</span><span class="btn sec">Until cancelled</span></div>
  </div>`)
  const chips = Object.fromEntries(['side', 'trig', 'amt', 'pay'].map((k) => [k, [...card.querySelectorAll(`[data-k=${k}] .chip`)].filter((c) => !c.classList.contains('in'))]))
  const lv = card.querySelector('.lv'), placeBtn = card.querySelector('.btn.pri')
  const toast2 = add(s2, `<div class="toast" style="left:50%;top:940px;transform:translateX(-50%)"><span class="ok">✓</span><span>Order placed<span class="sub">Limit buy: $500 of NVDA below $210. Watched while Verdex is open; nothing moves until you confirm.</span></span></div>`)

  // 3. The chart: the price wanders, then crosses the level.
  const s3 = add(stage, `<div class="scene"></div>`)
  const h3 = add(s3, `<div class="head" style="top:110px"><h1 class="serif">Verdex watches. You hold.</h1><p>The price is checked every 30 seconds. Your USDG stays in your wallet the whole time.</p></div>`)
  const chart = add(s3, `<div class="chart"><svg viewBox="0 0 1600 520" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C2EA8A" stop-opacity=".22"/><stop offset="1" stop-color="#C2EA8A" stop-opacity="0"/></linearGradient></defs><line class="lvline" x1="0" x2="1600" stroke="#C2EA8A" stroke-width="2" stroke-dasharray="10 10" opacity=".7"/><path class="area" fill="url(#g)"/><path class="ln" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle class="tip" r="9" fill="#fff"/><circle class="halo" r="9" fill="none" stroke="#C2EA8A" stroke-width="3" opacity="0"/></svg></div>`)
  const svg = chart.querySelector('svg'), lnEl = svg.querySelector('.ln'), areaEl = svg.querySelector('.area'), tipEl = svg.querySelector('.tip'), haloEl = svg.querySelector('.halo'), lvline = svg.querySelector('.lvline')
  const lvl = add(chart, `<div class="lvl buy">YOUR LEVEL · ${usd(LEVEL, 0)}</div>`)
  const now = add(chart, `<div class="now"><b>${usd(P0)}</b><span>NVDA · now</span></div>`)
  const days = add(s3, `<div class="days">${DAYS.map((d) => `<span>${d}</span>`).join('')}</div>`)
  const toast3 = add(s3, `<div class="toast" style="right:160px;top:930px"><span class="mk"><span style="width:22px;height:22px;display:inline-flex">${MARK()}</span></span><span>NVDA hit $210.00: limit buy ready<span class="sub">Orders · one tap to fill</span></span></div>`)
  const YMIN = 200, YMAX = 240
  const yOf = (v) => 520 - ((v - YMIN) / (YMAX - YMIN)) * 520

  // 4. The fill.
  const s4 = add(stage, `<div class="scene"></div>`)
  const h4 = add(s4, `<div class="head" style="top:110px"><h1 class="serif">One tap fills it.</h1><p>Priced through the best route at that moment. Confirmed in your wallet. Settled in your wallet.</p></div>`)
  const ocard = add(s4, `<div class="ocard hot"><div class="hd"><img src="${NVDA}" alt=""><div class="nm"><b>Limit buy · $500 below ${usd(LEVEL)}</b><span>NVDA on Robinhood Chain · paid in USDG · until cancelled</span></div><span class="badge hot">Triggered</span></div>
    <div class="meta"><span>Now <b style="color:#fff;font-weight:500">${usd(209.4)}</b> · <em>your level is +0.3% from here</em></span><span>Level ${usd(LEVEL)}</span></div>
    <div class="rail"><div class="ln"></div><div class="tick" style="left:56%"></div><div class="dot" style="left:52%"></div></div>
    <div class="btns"><span class="btn pri">${LOCK}<span class="lb">Confirm fill</span></span><span class="btn sec">Cancel</span></div>
    <div class="fill"><img src="${TOOL('kyberswap')}" alt="">500.00 USDG → 2.388 NVDA via KyberSwap · Robinhood Chain<span class="ck">✓ confirmed</span></div>
  </div>`)
  const badge = ocard.querySelector('.badge'), confirmBtn = ocard.querySelector('.btn.pri'), lb = ocard.querySelector('.lb'), fillEl = ocard.querySelector('.fill'), cancelBtn = ocard.querySelector('.btn.sec')
  const toast4 = add(s4, `<div class="toast" style="left:50%;top:900px;transform:translateX(-50%)"><span class="ok">✓</span><span>Filled<span class="sub">2.388 NVDA in your wallet, bought at the price you named. Not the price the market named.</span></span></div>`)

  // 5. Four order types.
  const s5 = add(stage, `<div class="scene"></div>`)
  const h5 = add(s5, `<div class="head" style="top:130px"><h1 class="serif">Four ways to name it.</h1></div>`)
  const TYPES = [['↓', 'b', 'Limit buy', 'Buy when it falls to your level.'], ['↑', 'b', 'Stop buy', 'Buy when it breaks above your level.'], ['↑', 's', 'Limit sell', 'Take profit when it rises to your level.'], ['↓', 's', 'Stop sell', 'A stop-loss: sell when it falls to your level.']]
  const types = TYPES.map(([ar, k, b, s], i) => add(s5, `<div class="type" style="left:${120 + i * 420}px;top:360px"><div class="ar ${k}">${ar}</div><b>${b}</b><span>${s}</span></div>`))
  const sub5 = add(s5, `<div class="abs" style="left:0;right:0;top:640px;text-align:center;font-size:32px;font-weight:500;letter-spacing:-0.015em;color:var(--soft);will-change:opacity,transform,filter">On every listed asset, with an expiry or good until cancelled. Cancel any time and nothing has happened.</div>`)

  // 6. Non-custodial.
  const s6 = add(stage, `<div class="scene"></div>`)
  const h6 = add(s6, `<div class="head" style="top:150px"><h1 class="serif">Never custodial.</h1></div>`)
  const LK = `<svg viewBox="0 0 24 24" fill="none" stroke="#C2EA8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`
  const CK = `<svg viewBox="0 0 24 24" fill="none" stroke="#C2EA8A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`
  const lines = [[LK, 'An open order is a note on your device. No deposit, no allowance.'], [CK, 'The fill is a swap you confirm, in your own wallet.'], [CK, 'Cancel it and nothing has happened.']].map(([ic, tx], i) => add(s6, `<div class="line" style="top:${420 + i * 130}px"><div>${ic}${tx}</div></div>`))

  // 7. Fee.
  const s7 = add(stage, `<div class="scene"></div>`)
  const tokenTile = add(s7, `<div class="abs" style="left:50%;top:170px;width:150px;height:150px;margin-left:-75px;border-radius:36px;background:#000;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;box-shadow:0 30px 80px rgba(0,0,0,.7);will-change:transform,opacity,filter"><span style="width:86px;height:86px;display:inline-flex">${MARK()}</span></div>`)
  const h7 = add(s7, `<div class="head" style="top:360px"><div class="tag" style="margin-bottom:22px">Hold VERDEX</div><h1 class="serif">Holders fill for free.</h1></div>`)
  const fee = add(s7, `<div class="feebox"><span>Verdex fee on the fill</span><span style="display:flex;align-items:center;gap:26px"><span class="old">0.25%<i></i></span><span class="new">0%</span></span></div>`)
  const feeStrike = fee.querySelector('.old i'), feeNew = fee.querySelector('.new')
  const sub7 = add(s7, `<div class="abs" style="left:0;right:0;top:790px;text-align:center;font-size:30px;font-weight:500;letter-spacing:-0.015em;color:var(--soft);will-change:opacity,transform,filter">0.25% becomes 0% on every fill. Checked onchain, every time.</div>`)

  // 8. End card.
  const s8 = add(stage, `<div class="scene"></div>`)
  const endLogo = add(s8, `<div class="abs" style="left:0;right:0;top:330px;display:flex;justify-content:center;align-items:center;gap:36px"><span style="width:160px;height:160px;display:inline-flex;margin-top:16px">${MARK()}</span><span class="serif" style="font-size:240px">Verdex</span></div>`)
  const endTag = add(s8, `<div class="abs" style="left:0;right:0;top:640px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)">Orders. Live now.</div>`)
  const endUrl = add(s8, `<div class="abs" style="left:0;right:0;top:740px;text-align:center"><span class="pill" style="font-size:30px;padding:14px 26px"><span style="width:14px;height:14px;border-radius:50%;background:var(--lime)"></span>useverdex.xyz/orders</span></div>`)
  const endCa = add(s8, `<div class="abs" style="left:0;right:0;top:850px;text-align:center"><span class="pill" style="font-size:24px;padding:12px 22px;gap:14px"><span style="color:var(--lime);font-weight:600;letter-spacing:.08em;font-size:18px">CA</span><span style="font-family:var(--mono)">0x96f455a90a80dcf0c2df6703ea4ba3bedf286e43</span></span></div>`)

  const g = document.createElement('canvas'); g.width = 480; g.height = 270
  const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
  gx.putImageData(id, 0, 0)
  add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
  add(stage, `<div id="vignette"></div>`)
  const fade = add(stage, `<div id="fade"></div>`)

  window.renderAt = (t) => {
    glow.style.opacity = 0.5 + 0.5 * Math.sin(t * 0.8)

    // 1. (0-5.6)
    show(s1, t < 6)
    wipe(comingChars, spring(t - 0.3, 0.9), { out: clamp(spring(t - 1.6, 0.35)) })
    const pn = spring(t - 1.9, 0.7)
    mat(nameEl, pn * (1 - clamp(spring(t - 5.2, 0.45))), { y: 40 * (1 - pn), s: 0.08, blur: 22 })
    wipe(tagChars, spring(t - 2.7, 0.9), { stagger: 0.03, out: clamp(spring(t - 5.1, 0.4)) })

    // 2. Form (5.6-12.6)
    show(s2, t >= 5.4 && t < 13.2)
    const o2 = clamp(spring(t - 12.4, 0.5))
    const h2in = spring(t - 5.6, 0.9)
    mat(h2, h2in * (1 - o2), { y: 24 * (1 - h2in), s: 0.02 })
    const c2 = spring(t - 5.8, 0.8)
    mat(card, c2 * (1 - o2), { y: 50 * (1 - c2) + 20 * o2, s: 0.06, blur: 18 })
    pick(chips.side, 0, 6.6, t)
    pick(chips.trig, 0, 7.3, t)
    const n = clamp(Math.floor((t - 7.9) / 0.14), 0, 3)
    lv.textContent = t >= 7.9 ? '210'.slice(0, n) || '2' : '224'
    pick(chips.amt, 3, 8.6, t)
    pick(chips.pay, 0, 9.3, t)
    pressAt(placeBtn, t, 10.2)
    toastIn(toast2, t, 10.6, 12.4, true)

    // 3. Chart (13-21.4)
    show(s3, t >= 12.8 && t < 22)
    const o3 = clamp(spring(t - 21.4, 0.5))
    const h3in = spring(t - 13.0, 0.9)
    mat(h3, h3in * (1 - o3), { y: 24 * (1 - h3in), s: 0.02 })
    const cin = spring(t - 13.3, 0.9)
    mat(chart, cin * (1 - o3), { y: 30 * (1 - cin), s: 0.02, blur: 14 })
    days.style.opacity = cin * (1 - o3)
    const T0 = 14.2, T1 = 19.6
    const prog = clamp((t - T0) / (T1 - T0))
    const pts = []
    const N = 120
    for (let i = 0; i <= N; i++) { const x = (i / N) * prog; pts.push([x * 1600, yOf(pathAt(x))]) }
    lnEl.setAttribute('d', pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' '))
    areaEl.setAttribute('d', `${pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')} L${(prog * 1600).toFixed(1)} 520 L0 520 Z`)
    const last = pts[pts.length - 1]
    tipEl.setAttribute('cx', last[0]); tipEl.setAttribute('cy', last[1])
    const crossedAt = T0 + CROSS * (T1 - T0)
    const hp = t >= crossedAt ? spring(t - crossedAt, 0.6, 0.5) : 0
    haloEl.setAttribute('cx', last[0]); haloEl.setAttribute('cy', last[1]); haloEl.setAttribute('r', (9 + 30 * clamp(hp)).toFixed(1)); haloEl.setAttribute('opacity', t >= crossedAt ? (1 - clamp(hp)).toFixed(2) : 0)
    lvline.setAttribute('y1', yOf(LEVEL)); lvline.setAttribute('y2', yOf(LEVEL))
    lvline.setAttribute('opacity', (0.7 * clamp(spring(t - 13.8, 0.8))).toFixed(2))
    lvl.style.top = `${yOf(LEVEL)}px`; lvl.style.opacity = clamp(spring(t - 13.9, 0.8))
    const price = pathAt(prog)
    now.querySelector('b').textContent = usd(price)
    now.style.left = `${Math.max(0, Math.min(last[0] - 70, 1370))}px`; now.style.top = `${Math.max(0, last[1] - 118)}px`
    now.style.opacity = cin
    now.querySelector('b').style.color = t >= crossedAt ? 'var(--lime)' : '#fff'
    toastIn(toast3, t, crossedAt + 0.4, 21.2)

    // 4. Fill (21.6-27.6)
    show(s4, t >= 21.4 && t < 28.2)
    const o4 = clamp(spring(t - 27.6, 0.5))
    const h4in = spring(t - 21.7, 0.9)
    mat(h4, h4in * (1 - o4), { y: 24 * (1 - h4in), s: 0.02 })
    const oin = spring(t - 21.9, 0.85)
    mat(ocard, oin * (1 - o4), { y: 40 * (1 - oin) + 20 * o4, s: 0.05, blur: 18 })
    pressAt(confirmBtn, t, 23.4)
    const filled = t >= 25.0
    lb.textContent = filled ? 'Filled' : t >= 23.6 ? 'Confirm in wallet…' : 'Confirm fill'
    confirmBtn.style.opacity = t >= 23.6 && !filled ? 0.6 : 1
    cancelBtn.style.opacity = filled ? 0.35 : 1
    badge.classList.toggle('hot', !filled); badge.classList.toggle('done', filled); badge.textContent = filled ? 'Filled' : 'Triggered'
    ocard.classList.toggle('hot', !filled)
    const fp = spring(t - 25.0, 0.7, 0.75)
    fillEl.style.opacity = filled ? clamp(fp * 1.5) : 0
    fillEl.style.transform = `translate3d(0, ${((1 - clamp(fp)) * 12).toFixed(2)}px, 0)`
    toastIn(toast4, t, 25.6, 27.4, true)

    // 5. Four types (28-31.4)
    show(s5, t >= 27.8 && t < 32)
    const o5 = clamp(spring(t - 31.2, 0.5))
    const h5in = spring(t - 28.0, 0.9)
    mat(h5, h5in * (1 - o5), { y: 24 * (1 - h5in), s: 0.02 })
    types.forEach((el, i) => { const p = spring(t - 28.3 - i * 0.18, 0.85); mat(el, p * (1 - o5), { y: 50 * (1 - p) + 20 * o5, s: 0.06, blur: 16 }) })
    const s5in = spring(t - 29.4, 0.9)
    mat(sub5, s5in * (1 - o5), { y: 16 * (1 - s5in), s: 0.02 })

    // 6. Non-custodial (31.6-33.6) short
    show(s6, t >= 31.4 && t < 34.2)
    const o6 = clamp(spring(t - 33.6, 0.5))
    const h6in = spring(t - 31.6, 0.9)
    mat(h6, h6in * (1 - o6), { y: 24 * (1 - h6in), s: 0.02 })
    lines.forEach((el, i) => { const p = spring(t - 31.9 - i * 0.3, 0.8); mat(el, p * (1 - o6), { y: 30 * (1 - p), s: 0.03, blur: 16 }) })

    // 7. Fee (33.8-37.4)
    show(s7, t >= 33.6 && t < 38)
    const o7 = clamp(spring(t - 37.4, 0.5))
    const tk = spring(t - 33.8, 0.7, 0.62)
    mat(tokenTile, clamp(tk * 1.5) * (1 - o7), { y: -40 * (1 - tk), s: 0.3, blur: 18 })
    const h7in = spring(t - 34.2, 0.9)
    mat(h7, h7in * (1 - o7), { y: 24 * (1 - h7in), s: 0.02 })
    const f7 = spring(t - 34.6, 0.8)
    mat(fee, f7 * (1 - o7), { y: 30 * (1 - f7), s: 0.04, blur: 16 })
    feeStrike.style.width = `${(clamp(spring(t - 35.4, 0.4)) * 100).toFixed(1)}%`
    const nz = spring(t - 35.7, 0.5, 0.55)
    feeNew.style.opacity = clamp(nz * 2); feeNew.style.transform = `scale(${lerp(0.6, 1, nz).toFixed(3)})`
    const s7in = spring(t - 36.0, 0.9)
    mat(sub7, s7in * (1 - o7), { y: 16 * (1 - s7in), s: 0.02 })

    // 8. End card (37.6-40)
    show(s8, t >= 37.4)
    const e1 = spring(t - 37.6, 0.7), e2 = spring(t - 37.95, 0.7), e3 = spring(t - 38.2, 0.7), e4 = spring(t - 38.4, 0.7)
    mat(endLogo, e1, { y: 30 * (1 - e1), s: 0.06, blur: 20 })
    mat(endTag, e2, { y: 20 * (1 - e2), s: 0.02 })
    mat(endUrl, e3, { y: 20 * (1 - e3), s: 0.02 })
    mat(endCa, e4, { y: 20 * (1 - e4), s: 0.02 })

    fade.style.opacity = Math.max(1 - clamp(t / 0.4), clamp((t - (DURATION - 0.4)) / 0.4))
  }
}

build()
await document.fonts.ready
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r }))))
window.DURATION = DURATION
window.renderAt(0)
window.__ready = true
if (new URLSearchParams(location.search).has('play')) { const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }; loop() }
</script>
</body>
</html>
