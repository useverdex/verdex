const PUB = '../public'
const DURATION = 31

function spring(t, response = 0.5, damping = 1) {
  if (t <= 0) return 0
  const w = (2 * Math.PI) / response
  if (damping >= 1) return 1 - (1 + w * t) * Math.exp(-w * t)
  const wd = w * Math.sqrt(1 - damping * damping)
  return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + ((damping * w) / wd) * Math.sin(wd * t))
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, p) => a + (b - a) * p
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2)
const easeOut = (p) => 1 - Math.pow(1 - p, 3)
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
// Materialize: opacity, blur and scale arrive together so the element reads as a surface, not a fade.
function mat(el, p, { y = 0, x = 0, s = 0.04, blur = 14, extra = '' } = {}) {
  el.style.opacity = clamp(p)
  el.style.filter = p >= 0.999 ? 'none' : `blur(${((1 - clamp(p)) * blur).toFixed(2)}px)`
  el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - s * (1 - p)}) ${extra}`
}
// Scene envelope: spring in at `a`, spring out at `b`.
const env = (t, a, b, rin = 0.6, rout = 0.55) => clamp(spring(t - a, rin)) * (1 - clamp(spring(t - b, rout)))

  add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
  add(stage, `<div id="vignette"></div>`)
  const fade = add(stage, `<div id="fade"></div>`)

  window.renderAt = (t) => {
    // Backdrop: visible in the intro and outro, dimmed in between.
    const bgIn = clamp(spring(t - 0.05, 1.6))
    const bgMid = 1 - 0.78 * clamp(spring(t - 4.2, 0.9)) * (1 - clamp(spring(t - 26.1, 1.1)))
    bg.style.opacity = bgIn * bgMid
    bg.firstElementChild.style.transform = `translate3d(${lerp(-24, 24, t / DURATION).toFixed(2)}px, ${lerp(10, -14, t / DURATION).toFixed(2)}px, 0) scale(${(1.1 - 0.06 * clamp(spring(t, 4))).toFixed(4)})`
    glow.style.opacity = 0.35 + 0.65 * clamp(spring(t - 4.3, 1)) * (1 - clamp(spring(t - 26, 1)))

    // 1. Intro
    const e1 = 1 - clamp(spring(t - 4.0, 0.6))
    s1.style.display = t < 5.2 ? '' : 'none'
    mat(s1pill, spring(t - 1.2, 0.6) * e1, { y: 18 * (1 - spring(t - 1.2, 0.6)) })
    letters.forEach((l, i) => { const p = spring(t - 0.45 - i * 0.07, 0.75); mat(l, p * e1, { y: 70 * (1 - p), s: 0.02, blur: 18 }) })
    mat(s1tag, spring(t - 1.6, 0.7) * e1, { y: 24 * (1 - spring(t - 1.6, 0.7)) })
    s1.style.transform = `scale(${1 - 0.05 * (1 - e1)})`

    // 2. Stocks
    const in2 = env(t, 4.3, 10.1)
    s2.style.display = t > 4.2 && t < 11.0 ? '' : 'none'
    const out2 = clamp(spring(t - 10.1, 0.55))
    s2.style.transform = `scale(${1 - 0.04 * out2})`; s2.style.filter = out2 > 0.001 ? `blur(${(out2 * 10).toFixed(2)}px)` : 'none'; s2.style.opacity = 1 - out2
    mat(s2pill, spring(t - 4.4, 0.6), { y: 16 * (1 - spring(t - 4.4, 0.6)) })
    mat(s2h.children[0], spring(t - 4.5, 0.7), { y: 50 * (1 - spring(t - 4.5, 0.7)) })
    const starts = [4.65, 6.15, 7.45, 8.75]
    words.forEach((w, i) => {
      const pin = spring(t - starts[i], 0.6)
      const pout = i < words.length - 1 ? spring(t - starts[i + 1], 0.6) : 0
      w.style.transform = `translate3d(0, ${((1 - pin) * 125 - pout * 125).toFixed(2)}%, 0)`
      w.style.opacity = t < starts[i] ? 0 : 1
    })
    mat(s2sub, spring(t - 5.0, 0.7), { y: 24 * (1 - spring(t - 5.0, 0.7)) })
    cnt.textContent = Math.round(DATA.assets * easeOut(clamp((t - 5.0) / 1.6)))
    grid.style.transform = `translate3d(0, ${(-(t - 4.3) * 7).toFixed(2)}px, 0)`
    tiles.forEach(({ el, col, row }, i) => {
      const t0 = 4.6 + (col + row) * 0.075
      const p = spring(t - t0, 0.62, 0.78) // thrown in: a little bounce is earned here
      el.style.opacity = clamp(spring(t - t0, 0.3))
      el.style.transform = `translate3d(0, ${((1 - p) * 180).toFixed(2)}px, 0) rotate(${((1 - p) * (i % 2 ? 5 : -5)).toFixed(2)}deg)`
    })

    // 3. Issuers
    s3.style.display = t > 10.2 && t < 15.9 ? '' : 'none'
    const out3 = clamp(spring(t - 15.0, 0.55))
    s3.style.transform = `scale(${1 - 0.04 * out3})`; s3.style.filter = out3 > 0.001 ? `blur(${(out3 * 10).toFixed(2)}px)` : 'none'; s3.style.opacity = 1 - out3
    mat(s3h1, spring(t - 10.35, 0.75), { y: 50 * (1 - spring(t - 10.35, 0.75)) })
    mat(s3h2, spring(t - 11.0, 0.75), { y: 50 * (1 - spring(t - 11.0, 0.75)) })
    issuers.forEach((el, i) => { const p = spring(t - 11.4 - i * 0.085, 0.6); mat(el, p, { y: 40 * (1 - p), s: 0.1, blur: 16 }) })

    // 4. Swap
    s4.style.display = t > 15.1 && t < 21.7 ? '' : 'none'
    const out4 = clamp(spring(t - 20.8, 0.55))
    s4.style.transform = `scale(${1 - 0.04 * out4})`; s4.style.filter = out4 > 0.001 ? `blur(${(out4 * 10).toFixed(2)}px)` : 'none'; s4.style.opacity = 1 - out4
    mat(s4pill, spring(t - 15.2, 0.6), { y: 16 * (1 - spring(t - 15.2, 0.6)) })
    mat(s4h1, spring(t - 15.3, 0.75), { y: 50 * (1 - spring(t - 15.3, 0.75)) })
    mat(s4h2, spring(t - 15.7, 0.75), { y: 50 * (1 - spring(t - 15.7, 0.75)) })
    mat(s4sub, spring(t - 16.1, 0.7), { y: 24 * (1 - spring(t - 16.1, 0.7)) })
    const ps = spring(t - 15.45, 0.7)
    mat(swap, ps, { x: 90 * (1 - ps), s: 0.05, blur: 20 })
    chains.forEach((c, i) => {
      const a = (i / chains.length) * Math.PI * 2 + (t - 15) * 0.1
      const p = spring(t - 15.6 - i * 0.06, 0.8)
      const r = lerp(250, 410, p)
      c.style.left = `${(Math.cos(a) * r).toFixed(2)}px`; c.style.top = `${(Math.sin(a) * r * 0.9).toFixed(2)}px`
      c.style.opacity = clamp(p) * 0.95
    })
    const typed = '1,000'.slice(0, clamp(Math.floor((t - 16.5) / 0.12), 0, 5))
    pay.textContent = typed || '0'; pay.style.color = typed ? '#fff' : 'var(--muted)'
    const q = clamp(spring(t - 17.35, 0.8))
    get.textContent = t < 17.35 ? '0' : (4.4579 * easeOut(clamp((t - 17.35) / 0.9))).toFixed(4)
    get.style.color = q > 0.5 ? '#fff' : 'var(--muted)'
    mat(route, spring(t - 18.0, 0.5), { y: 10 * (1 - spring(t - 18.0, 0.5)), s: 0 })
    // Cursor travels to the button and presses it; feedback lands on the press, not the release.
    const cp = spring(t - 18.3, 0.9)
    const bx = CTA.x, by = CTA.y - 8
    cursor.style.opacity = clamp(spring(t - 18.2, 0.4)) * (1 - clamp(spring(t - 20.2, 0.4)))
    cursor.style.transform = `translate3d(${lerp(1780, bx, cp).toFixed(2)}px, ${lerp(1000, by + 8, cp).toFixed(2)}px, 0)`
    const press = t >= 19.35 && t < 19.5
    const done = t >= 19.5
    cta.style.transform = `scale(${press ? 0.97 : 1})`
    cta.style.background = done ? 'var(--lime)' : '#fff'
    cta.textContent = done ? '✓  Bought 4.4579 NVDA' : 'Buy NVDA'
    const rp = clamp((t - 19.35) / 0.6)
    ripple.style.opacity = t >= 19.35 ? (1 - rp) * 0.8 : 0
    ripple.style.transform = `translate3d(${bx}px, ${by + 8}px, 0) scale(${1 + rp * 2.2})`

    // 5. Product
    s5.style.display = t > 20.9 && t < 26.8 ? '' : 'none'
    const out5 = clamp(spring(t - 25.9, 0.55))
    s5.style.opacity = 1 - out5; s5.style.filter = out5 > 0.001 ? `blur(${(out5 * 10).toFixed(2)}px)` : 'none'
    mat(s5pill, spring(t - 21.0, 0.6), { y: 16 * (1 - spring(t - 21.0, 0.6)) })
    mat(s5h1, spring(t - 21.1, 0.75), { y: 50 * (1 - spring(t - 21.1, 0.75)) })
    mat(s5h2, spring(t - 21.5, 0.75), { y: 50 * (1 - spring(t - 21.5, 0.75)) })
    mat(s5sub, spring(t - 21.9, 0.7), { y: 24 * (1 - spring(t - 21.9, 0.7)) })
    const pa = spring(t - 21.25, 0.9), pb = spring(t - 21.45, 0.9)
    winA.style.opacity = clamp(pa); winB.style.opacity = clamp(pb) * 0.7
    winA.style.transform = `translate3d(0, ${((1 - pa) * 160).toFixed(2)}px, 0) rotateY(${lerp(-24, -13, pa).toFixed(2)}deg) rotateX(${lerp(18, 7, pa).toFixed(2)}deg)`
    winB.style.transform = `translate3d(0, ${((1 - pb) * 160).toFixed(2)}px, -220px) rotateY(${lerp(-24, -13, pb).toFixed(2)}deg) rotateX(${lerp(18, 7, pb).toFixed(2)}deg)`
    const sc = easeInOut(clamp((t - 21.8) / 4.2))
    imgA.style.transform = `translate3d(0, ${(-sc * 1250).toFixed(2)}px, 0)`
    imgB.style.transform = `translate3d(0, ${(-sc * 700).toFixed(2)}px, 0)`

    // 6. Outro
    s6.style.display = t > 26.0 ? '' : 'none'
    const p6 = spring(t - 26.3, 0.8)
    mat(s6logo, p6, { y: 60 * (1 - p6), s: 0.03, blur: 20 })
    mat(s6tag, spring(t - 27.0, 0.7), { y: 24 * (1 - spring(t - 27.0, 0.7)) })
    mat(s6ca, spring(t - 27.5, 0.7), { y: 24 * (1 - spring(t - 27.5, 0.7)) })

    // Fade in from black and back out, so the loop on X is seamless.
    fade.style.opacity = Math.max(1 - clamp(t / 0.5), clamp((t - (DURATION - 0.6)) / 0.6))
  }
  window.DURATION = DURATION
  await document.fonts.ready
  const r = cta.getBoundingClientRect(); const CTA_ = { x: r.left + r.width * 0.62, y: r.top + r.height * 0.55 }; Object.assign(CTA, CTA_)
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r }))))
  window.renderAt(0)
  window.__ready = true
  if (new URLSearchParams(location.search).has('play')) { const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }; loop() }
}
build()
</script>
