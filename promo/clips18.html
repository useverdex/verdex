<script type="module">
// Ten 12-second clips for the tenth tweet batch: the parts of Verdex never announced, from automated baskets to the app shell. ?clip=<name>
import { MARK_PATH } from '../src/components/logoPath.ts'
const MARK = (fill = '#C2EA8A') => `<svg viewBox="0 0 100 100" fill="${fill}" style="display:block"><path d="${MARK_PATH}"/></svg>`
const PUB = '../public'
const L = (h) => `${PUB}/img/logos/${h}.webp`
const CH = (id) => `${PUB}/logos/chains/${id}.svg`
const TOOL = (k) => `${PUB}/logos/tools/${k}.svg`
const LOGO = { NVDA: L('88a0e630'), SPY: L('c025dcd9'), TSLA: L('e8ca24f9'), GLD: L('8123a79a'), SLV: L('29352778'), USO: L('f34687ee'), PAXG: L('7869a6ce'), XAUT: L('941acb6b'), META: L('0b00cc62'), GOOGL: L('4d76db13'), SPCX: L('5a9801c3'), AMZN: L('39c11fed'), QQQ: L('8fbe91e2'), MSTR: L('48f06241'), IBIT: L('4c80de69'), TLT: L('0ee1c35f') }
const USDG = `${PUB}/img/tokens/usdg.png`, USDC = `${PUB}/img/tokens/usdc.png`
const clip = new URLSearchParams(location.search).get('clip') ?? 'fee'
const DURATION = 12

function spring(t, response = 0.5, damping = 1) {
  if (t <= 0) return 0
  const w = (2 * Math.PI) / response
  if (damping >= 1) return 1 - (1 + w * t) * Math.exp(-w * t)
  const wd = w * Math.sqrt(1 - damping * damping)
  return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + ((damping * w) / wd) * Math.sin(wd * t))
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, p) => a + (b - a) * p
const easeIO = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2)
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
const mat = (el, p, { y = 0, x = 0, s = 0.04, blur = 14 } = {}) => {
  el.style.opacity = clamp(p)
  el.style.filter = p >= 0.999 ? 'none' : `blur(${((1 - clamp(p)) * blur).toFixed(2)}px)`
  el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - s * (1 - p)})`
}
const letters = (el, text) => { el.innerHTML = ''; return [...text].map((c) => add(el, `<span class="ch${c === ' ' ? ' sp' : ''}">${c === ' ' ? '' : c}</span>`)) }
function wipe(chars, p, { stagger = 0.045, blur = 12, dx = 18, out = 0 } = {}) {
  const n = chars.length
  chars.forEach((c, i) => {
    const q = clamp((p * (1 + stagger * n) - i * stagger)) * (1 - out)
    c.style.opacity = q
    c.style.filter = q >= 0.999 ? 'none' : `blur(${((1 - q) * blur).toFixed(2)}px)`
    c.style.transform = `translate3d(${((1 - q) * dx).toFixed(2)}px, 0, 0)`
  })
}
const show = (el, on) => { el.style.display = on ? '' : 'none' }
const usd = (v, d = 0) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })
const line = (parent, text, { top = 460, size = 112, color = '#fff' } = {}) => {
  const el = add(parent, `<div class="line" style="top:${top}px"><div class="serif t" style="font-size:${size}px;color:${color}"></div></div>`)
  return { el, chars: letters(el.querySelector('.t'), text) }
}
const runLine = (ln, t, t0, t1, stagger = 0.035) => { show(ln.el, t >= t0 - 0.05 && t < t1 + 0.6); wipe(ln.chars, spring(t - t0, 0.8), { stagger, out: clamp(spring(t - t1, 0.35)) }) }
const rise = (el, t, t0, { y = 14, r = 0.6 } = {}) => { const p = spring(t - t0, r); show(el, t >= t0 - 0.05); el.style.opacity = clamp(p * 1.4); el.style.transform = `translate3d(0, ${((1 - p) * y).toFixed(2)}px, 0)` }
const capIn = (el, t, t0) => { const q = spring(t - t0, 0.9); show(el, t > t0 - 0.1); mat(el, q, { y: 16 * (1 - q), s: 0.02 }) }
const pick = (list, idx, t0, t) => list.forEach((c, i) => { const p = spring(t - t0, 0.35, 0.6); const on = i === idx && t >= t0; c.classList.toggle('on', on); c.style.transform = on ? `scale(${(1 + 0.08 * (1 - p)).toFixed(3)})` : 'none' })
const typed = (el, text, t, t0, cps = 26, cursor = true) => { const n = clamp(Math.floor((t - t0) * cps), 0, text.length); const done = n >= text.length; el.innerHTML = text.slice(0, n) + (cursor && !done && t >= t0 ? '<span class="cur"></span>' : ''); return done }
const I = {
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
}

const PRE = (slug) => `${PUB}/logos/private/${slug}.png`
const SOLL = CH(1151111081099710)
const CLIPS = {

    const rows = R.map(([sl, n, f, nx], i) => add(s, `<div class="trow" style="top:${270 + i * 90}px;height:78px"><img class="l" src="${PRE(sl)}" alt="" style="width:40px;height:40px"><b style="width:220px">${n}</b><span class="nm">Token-2022 transfer fee, on every transfer, the buy included</span><span class="s" style="min-width:230px">${nx}</span><span class="v ${nx.startsWith('5') ? '' : 'lime'}" style="min-width:90px">${f}</span></div>`))

      capIn(cap, t, 8.6)

  // 2. The mint check catches a replaced mint.
  mintcheck(s) {

    const l2 = line(s, 'Same name. Check first.', { top: 470, size: 96, color: 'var(--lime)' })
    const panel = add(s, `<div class="panel" style="top:300px;width:1000px;margin-left:-500px;padding:30px 36px 32px"><div class="lab">Check a mint before you buy it</div>
      <div style="display:flex;gap:12px"><div class="addr" style="position:static;width:auto;flex:1;margin:0"><span class="k" style="width:auto;margin-right:14px">Mint</span><span class="tx"></span></div><span class="btn pri go" style="height:64px;border-radius:16px;font-size:20px">Check</span></div>
      <div class="vd" style="margin-top:18px;padding:20px 22px;border-radius:16px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);display:flex;gap:16px;align-items:flex-start"><span style="color:var(--red);font-size:26px;line-height:1;margin-top:2px">✕</span><div><b style="display:block;font-size:22px;font-weight:500">Replaced OpenAI mint</b><span style="display:block;font-size:17px;color:var(--muted);margin-top:4px;line-height:1.4">The issuer replaced this mint with a newer one and renamed it OUTDATED. It is not the OpenAI that trades today.</span></div></div></div>`)
    const tx = panel.querySelector('.tx'), go = panel.querySelector('.go'), vd = panel.querySelector('.vd')
    const cap = add(s, `<div class="cap" style="top:760px">By Verdex's list of replaced and refunded mints first, by Jupiter's name for anything else. Paste before you buy, not after.</div>`)
    return (t) => {
      runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2)
      const p = spring(t - 4.5, 0.85); show(panel, t > 4.4); mat(panel, p, { y: 30 * (1 - p), s: 0.03, blur: 12 })
      typed(tx, 'PreYKD2kJ5xGgoZ644VPfbEN7sW8bWCUREHr5S3ebV9', t, 5.2, 40)
      go.style.background = t >= 6.5 ? 'var(--lime)' : '#fff'
      const v = spring(t - 6.7, 0.6); vd.style.opacity = clamp(v); vd.style.transform = `translate3d(0, ${(12 * (1 - v)).toFixed(2)}px, 0)`
      capIn(cap, t, 8.8)
    }
  },
  // 3. Two ways a pre-IPO token ends.
  gone(s) {
    const l1 = line(s, 'Two ways it ends.', { top: 470 })
    const l2 = line(s, 'Both on the page.', { top: 470, color: 'var(--lime)' })
    const T = [['spacex', 'SpaceX', 'Listed', 'Listed in June 2026. The public stock trades tokenized as SPCX, in Markets. What is left of the pre-IPO token is a conversion pool.', '$117.4K left · 9,894 holders · fee 1%'], ['xai', 'xAI', 'Conversion closed', 'The issuer closed the conversion window on 12 September 2026. The pool that remains has almost no liquidity.', '$181 left · 1,460 holders · fee 0%']]
    const tiles = T.map(([sl, n, tag, txt, foot], i) => add(s, `<div class="atile" style="left:50%;top:330px;margin-left:${i === 0 ? -560 : 60}px;width:500px;padding:28px 30px"><div style="display:flex;align-items:center;gap:14px"><img src="${PRE(sl)}" alt="" style="width:48px;height:48px;margin:0"><b style="margin:0;font-size:28px">${n}</b><span class="badge" style="margin-left:auto">${tag}</span></div><span style="margin-top:18px;font-size:18px;line-height:1.45;color:var(--soft)">${txt}</span><span style="margin-top:16px;font-size:16px">${foot}</span></div>`))
    const cap = add(s, `<div class="cap" style="top:800px">Read from the same feeds as the seven still private. What the chain says, not a recommendation.</div>`)
    return (t) => {
      runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2)
      tiles.forEach((el, i) => { const p = spring(t - 4.5 - i * 0.3, 0.85); show(el, t > 4.4 + i * 0.3); mat(el, p, { y: 30 * (1 - p), s: 0.03, blur: 12 }) })
      capIn(cap, t, 8.4)

  // 4. Twelve of thirteen.
  thirteen(s) {

    const rows = R.map(([n, st], i) => add(s, `<div class="trow" style="top:${150 + i * 58}px;height:50px;width:900px;margin-left:-450px;padding:0 20px"><span class="${st === 'next' ? '' : 'ok'}" style="width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:${st === 'next' ? 'rgba(255,255,255,.08)' : 'rgba(194,234,138,.16)'};color:var(--lime)"><span style="width:14px;height:14px;display:inline-block">${st === 'next' ? '' : I.check}</span></span><b style="width:340px;font-size:20px">${n}</b><span class="nm" style="font-size:16px">${st}</span></div>`))
    const cap = add(s, `<div class="cap" style="top:940px;font-size:28px">The one left is Auto-Invest that runs without you. Next.</div>`)
    return (t) => {
      runLine(l1, t, 0.3, 2.0); runLine(l2, t, 2.3, 4.2)
      rows.forEach((el, i) => { const p = spring(t - 4.4 - i * 0.16, 0.8); show(el, t > 4.3 + i * 0.16); mat(el, p, { y: 20 * (1 - p), s: 0.02, blur: 10 }); el.classList.toggle('on', t >= 7.4 && i === 11) })

add(stage, `<div class="grid"></div>`)
const glow = add(stage, `<div class="abs" style="left:50%;top:50%;width:1400px;height:900px;margin:-450px 0 0 -700px;background:radial-gradient(closest-side,rgba(194,234,138,.12),rgba(194,234,138,0));pointer-events:none"></div>`)
const scene = add(stage, `<div class="scene"></div>`)
const draw = CLIPS[clip](scene)
const g = document.createElement('canvas'); g.width = 480; g.height = 270
const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
gx.putImageData(id, 0, 0)
add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
add(stage, `<div id="vignette"></div>`)
const fade = add(stage, `<div id="fade"></div>`)
window.renderAt = async (t) => {
  glow.style.opacity = 0.5 + 0.5 * Math.sin(t * 0.8)
  await draw(t)
  fade.style.opacity = Math.max(1 - clamp(t / 0.4), clamp((t - (DURATION - 0.4)) / 0.4))
}
await document.fonts.ready
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r }))))
window.DURATION = DURATION
await window.renderAt(0)
window.__ready = true
if (new URLSearchParams(location.search).has('play')) { const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }; loop() }
