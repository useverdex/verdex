<!doctype html>
<html lang="en">

<style>

.panel { position: absolute; width: 900px; box-sizing: border-box; padding: 30px 36px 32px; border-radius: 22px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 50px 120px rgba(0,0,0,.7); will-change: transform, opacity, filter; }

.panel .big { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 26px; }

.panel .big b.lime { color: var(--lime); }

.row .t { flex: 1; color: var(--soft); }

.row .a.lime { color: var(--lime); }

/* Bounty tiles */
.tile { position: absolute; width: 400px; height: 230px; padding: 26px 28px; box-sizing: border-box; border-radius: 20px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 80px rgba(0,0,0,.6); will-change: transform, opacity, filter; }

.pos .top { display: flex; align-items: center; gap: 16px; }

.pos .fees .b { margin-left: auto; padding: 10px 18px; border-radius: 12px; background: rgba(255,255,255,.08); color: #fff; font-weight: 500; }
.pos .fees .b + .b { margin-left: 0; }
.sched { position: absolute; left: 50%; top: 330px; width: 1000px; margin-left: -500px; display: grid; gap: 12px; }
.buy { display: flex; align-items: center; gap: 18px; height: 78px; padding: 0 24px; border-radius: 16px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); font-size: 22px; will-change: opacity, transform, filter; }
.buy .d { width: 190px; color: var(--muted); font-size: 18px; }
.buy .a { flex: 1; }
.buy .o { font-weight: 500; font-variant-numeric: tabular-nums; }
.buy .s { width: 150px; text-align: right; font-size: 16px; color: var(--muted); }
.buy.done .s { color: var(--lime); }
.buy.next { border-color: rgba(194,234,138,.45); }
.stk { position: absolute; width: 168px; height: 84px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; will-change: transform, opacity, filter; }
.stk img { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
.stk.on { border-color: var(--lime); background: #151a10; box-shadow: 0 0 0 1px var(--lime), 0 20px 50px rgba(194,234,138,.18); }
.chip img { width: 22px; height: 22px; border-radius: 50%; vertical-align: -5px; margin-right: 8px; }
</style>
</head>

function spring(t, response = 0.5, damping = 1) {
  if (t <= 0) return 0
  const w = (2 * Math.PI) / response
  if (damping >= 1) return 1 - (1 + w * t) * Math.exp(-w * t)
  const wd = w * Math.sqrt(1 - damping * damping)
  return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + ((damping * w) / wd) * Math.sin(wd * t))
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const $ = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (parent, html) => { const el = $(html); parent.appendChild(el); return el }
const mat = (el, p, { y = 0, x = 0, s = 0.04, blur = 14 } = {}) => {
  el.style.opacity = clamp(p)
  el.style.filter = p >= 0.999 ? 'none' : `blur(${((1 - clamp(p)) * blur).toFixed(2)}px)`
  el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - s * (1 - p)})`
}
const letters = (el, text) => { el.innerHTML = ''; return [...text].map((c) => add(el, `<span class="ch${c === ' ' ? ' sp' : ''}">${c === ' ' ? '' : c}</span>`)) }
function wipe(chars, p, { stagger = 0.045, blur = 12, dx = 18, out = 0 } = {}) {
  const n = chars.length
  chars.forEach((c, i) => {
    const q = clamp((p * (1 + stagger * n) - i * stagger)) * (1 - out)
    c.style.opacity = q
    c.style.filter = q >= 0.999 ? 'none' : `blur(${((1 - q) * blur).toFixed(2)}px)`
    c.style.transform = `translate3d(${((1 - q) * dx).toFixed(2)}px, 0, 0)`
  })
}
const show = (el, on) => { el.style.display = on ? '' : 'none' }

const CHIP = (txt, logo, on = false) => `<span class="chip${on ? ' on' : ''}">${logo ? `<img src="${LOGO(logo)}" alt="">` : ''}${txt}</span>`

  const tagEl = add(s1, `<div class="abs" style="left:0;right:0;top:860px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)"><div></div></div>`)
  const tagChars = letters(tagEl.firstElementChild, 'Launch a token on Robinhood Chain, paired with the stock you choose.')

  // 2. The wall. (5.2-13.4)
  const s2 = add(stage, `<div class="scene"></div>`)
  const h2 = add(s2, `<div class="head" style="top:70px"><h1 class="serif">Forty-two stocks to pair with.</h1><p>Every tokenized stock the Pons factory accepts as a quote, read from the contract as you look. ETH and USDG too.</p></div>`)
  const COLS = 7, TW = 168, TH = 84, GAP = 12

  const cap2 = add(s2, `<div class="cap" style="top:900px">Pick one. Your token is priced in it from the first block.</div>`)

  // 3. The composer. (13-23.8)

  const h3 = add(s3, `<div class="head" style="top:70px"><h1 class="serif">Same token. Any pair.</h1><p>The stock you pick is what buyers pay in, what the curve holds and what your fee arrives in. The threshold follows it.</p></div>`)

    <div style="display:grid;grid-template-columns:1fr 200px;gap:12px;margin-top:22px"><div class="field" style="margin-top:0"><div class="k"><span>Name</span></div><div class="v"><span class="n1" style="font-size:28px;color:#fff;font-weight:500">&nbsp;</span></div></div><div class="field" style="margin-top:0"><div class="k"><span>Symbol</span></div><div class="v"><span class="n2" style="font-size:28px;color:#fff;font-weight:500">&nbsp;</span></div></div></div>
    <div class="lab" style="margin-top:20px">Priced in</div><div class="chips">${CHIP('ETH')}${CHIP('USDG')}${SEQ.map((k) => CHIP(k, by[k][2])).join('')}${CHIP('GOOGL', by.GOOGL[2])}${CHIP('All 44')}</div>
    <div class="field" style="margin-top:20px"><div class="k"><span>Your first buy</span><span>Balance · Max</span></div><div class="v"><span class="n3" style="font-size:30px;color:#fff;font-weight:500">0.5</span><span class="qs">NVDA</span></div></div>
    <div class="sum"><div>Buyers pay in <b class="qs">NVDA</b></div><div>Graduates at <b class="th">41.6 NVDA · $9,332</b></div><div>Creator fee, 2% of every trade, paid in <b class="qs">NVDA</b></div><div>Verdex fee <b>None</b></div></div>
    <div class="btn">Launch MOON, priced in <span class="qs">NVDA</span></div></div>`)
  const n1 = comp.querySelector('.n1'), n2 = comp.querySelector('.n2'), sym = comp.querySelector('.sym'), btn = comp.querySelector('.btn'), ql = comp.querySelector('.ql'), th = comp.querySelector('.th'), qss = [...comp.querySelectorAll('.qs')], chips = [...comp.querySelectorAll('.chips .chip')], sum = comp.querySelector('.sum')

  const endTag = add(s5, `<div class="abs" style="left:0;right:0;top:610px;text-align:center;font-size:40px;font-weight:500;letter-spacing:-0.015em;color:var(--soft)">Launchpad. Priced in any stock.</div>`)
  const endUrl = add(s5, `<div class="abs" style="left:0;right:0;top:710px;text-align:center"><span class="pill" style="font-size:30px;padding:14px 26px"><span style="width:14px;height:14px;border-radius:50%;background:var(--lime)"></span>useverdex.xyz/launch</span></div>`)
  const endCa = add(s5, `<div class="abs" style="left:0;right:0;top:820px;text-align:center"><span class="pill" style="font-size:24px;padding:12px 22px;gap:14px"><span style="color:var(--lime);font-weight:600;letter-spacing:.08em;font-size:18px">CA</span><span style="font-family:var(--mono)">0x96f455a90a80dcf0c2df6703ea4ba3bedf286e43</span></span></div>`)

  const g = document.createElement('canvas'); g.width = 480; g.height = 270
  const gx = g.getContext('2d'), id = gx.createImageData(480, 270)
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255 }
  gx.putImageData(id, 0, 0)
  add(stage, `<img id="grain" src="${g.toDataURL()}" style="width:100%;height:100%;image-rendering:pixelated">`)
  add(stage, `<div id="vignette"></div>`)
  const fade = add(stage, `<div id="fade"></div>`)

  window.renderAt = (t) => {
    glow.style.opacity = 0.5 + 0.5 * Math.sin(t * 0.8)

    show(s1, t < 5.6)
    const pn = spring(t - 0.3, 0.7)
    mat(nameEl, pn * (1 - clamp(spring(t - 4.8, 0.45))), { y: 40 * (1 - pn), s: 0.08, blur: 22 })
    wipe(tagChars, spring(t - 1.6, 0.9), { stagger: 0.02, out: clamp(spring(t - 4.7, 0.4)) })

    show(s2, t >= 5.2 && t < 13.4)
    const o2 = clamp(spring(t - 12.6, 0.5))
    const h2in = spring(t - 5.4, 0.9)
    mat(h2, h2in * (1 - o2), { y: 24 * (1 - h2in), s: 0.02 })
    const hop = t >= 9.6 ? Math.min(STOCKS.length - 1, Math.floor((t - 9.6) / 0.075)) : -1
    tiles.forEach((el, i) => {
      const p = spring(t - (5.7 + i * 0.055), 0.75)
      const on = i === hop
      el.classList.toggle('on', on)
      mat(el, p * (1 - o2), { y: 30 * (1 - p), s: on ? -0.06 : 0.05, blur: 12 })
    })
    const c2 = spring(t - 9.2, 0.9)
    mat(cap2, c2 * (1 - o2), { y: 16 * (1 - c2), s: 0.02 })

    show(s3, t >= 13 && t < 23.8)
    const o3 = clamp(spring(t - 23.0, 0.5))
    const h3in = spring(t - 13.2, 0.9)
    mat(h3, h3in * (1 - o3), { y: 24 * (1 - h3in), s: 0.02 })
    const c3 = spring(t - 13.5, 0.85)
    mat(comp, c3 * (1 - o3), { y: 40 * (1 - c3) + 20 * o3, s: 0.05, blur: 18 })
    n1.innerHTML = t >= 14.0 ? typed('Moon Index', (t - 14.0) / 0.7) || '&nbsp;' : '&nbsp;'
    const symText = t >= 14.8 ? typed('MOON', (t - 14.8) / 0.4) : ''
    n2.innerHTML = symText || '&nbsp;'
    sym.innerHTML = symText || '&nbsp;'
    const step = t >= 15.6 ? Math.min(SEQ.length - 1, Math.floor((t - 15.6) / 1.4)) : 0
    const cur = by[SEQ[step]]
    const since = t - (15.6 + step * 1.4)
    chips.forEach((c, i) => c.classList.toggle('on', t >= 15.6 && i === 2 + step))
    ql.src = LOGO(cur[2])
    qss.forEach((el) => (el.textContent = cur[0]))
    th.textContent = `${cur[3]} ${cur[0]} · ${usd(cur[4])}`
    const pop = t >= 15.6 ? spring(since, 0.4) : 1
    sum.style.opacity = 0.35 + 0.65 * pop
    sum.style.transform = `translate3d(0, ${(4 * (1 - pop)).toFixed(2)}px, 0)`
    btn.style.background = t >= 22.6 ? 'var(--lime)' : '#fff'
    if (t >= 22.6) btn.textContent = 'Confirm in your wallet…'
    else btn.innerHTML = `Launch MOON, priced in ${cur[0]}`

    show(s4, t >= 23.4 && t < 30.8)
    const o4 = clamp(spring(t - 30.2, 0.5))
    const h4in = spring(t - 23.6, 0.9)
    mat(h4, h4in * (1 - o4), { y: 24 * (1 - h4in), s: 0.02 })
    rows4.forEach((el, i) => { const p = spring(t - (24.1 + i * 0.3), 0.85); mat(el, p * (1 - o4), { y: 30 * (1 - p), s: 0.03, blur: 12 }) })

    show(s5, t >= 30.4)
    const e1p = spring(t - 30.6, 0.7), e2p = spring(t - 30.95, 0.7), e3p = spring(t - 31.2, 0.7), e4p = spring(t - 31.4, 0.7)
    mat(endLogo, e1p, { y: 30 * (1 - e1p), s: 0.06, blur: 20 })
    mat(endTag, e2p, { y: 20 * (1 - e2p), s: 0.02 })
    mat(endUrl, e3p, { y: 20 * (1 - e3p), s: 0.02 })
    mat(endCa, e4p, { y: 20 * (1 - e4p), s: 0.02 })

    fade.style.opacity = Math.max(1 - clamp(t / 0.4), clamp((t - (DURATION - 0.4)) / 0.4))
  }
}

build()
await document.fonts.ready
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r }))))
window.DURATION = DURATION
window.renderAt(0)
window.__ready = true
if (new URLSearchParams(location.search).has('play')) { const t0 = performance.now(); const loop = () => { window.renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }; loop() }
</script>
</body>
</html>
